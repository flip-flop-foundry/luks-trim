{{- if .Values.createNamespace }}
{{- /*
  Only render this resource if the namespace does not already exist.
  When Helm encounters a pre-existing namespace it issues a CREATE and
  fails with "already exists".  By skipping the template when the namespace
  is present we avoid that conflict while still creating it (with all the
  desired labels) on a truly fresh install.

  For existing namespaces the caller is responsible for ensuring the
  correct labels are present — the integration-test workflow does this
  with "kubectl apply" before running helm, so labels are always set.
  ArgoCD / FluxCD use server-side apply and handle create-vs-patch
  automatically, so the template renders correctly there too.
*/}}
{{- if not (lookup "v1" "Namespace" "" (include "luks-trim.namespace" .)) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "luks-trim.namespace" . }}
  labels:
    {{- include "luks-trim.labels" . | nindent 4 }}
    {{- with .Values.namespaceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
