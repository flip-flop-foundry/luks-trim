{{- if .Values.createNamespace }}
{{- /*
  Always render this resource so that Helm owns the namespace and its labels.
  On a fresh cluster Helm creates it; on a pre-existing namespace Helm patches
  it (server-side apply), so labels are always reconciled.

  Use `helm upgrade --install --server-side --create-namespace …` to avoid
  "already exists" errors when the namespace pre-dates the Helm release.
  `--create-namespace` ensures the namespace exists before Helm stores its
  release secret; `--server-side` makes every resource (including this
  Namespace) use a PATCH rather than a CREATE, so pre-existing namespaces
  are updated instead of rejected.

  To manage the namespace entirely outside the chart set:
    createNamespace: false
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "luks-trim.namespace" . }}
  labels:
    {{- include "luks-trim.labels" . | nindent 4 }}
    {{- with .Values.namespaceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
