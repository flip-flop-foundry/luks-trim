{{- if .Values.createNamespace }}
{{- /*
  Always render this resource so that Helm owns the namespace and its labels.

  Helm 4 uses server-side apply (SSA) by default, so this resource is always
  applied as a PATCH rather than a CREATE.  Labels are reconciled on every
  helm upgrade, whether the namespace is brand-new or already existed before
  the chart was installed.

  With Helm 3 (--server-side flag required for the same behaviour):
    helm upgrade --install --server-side --create-namespace ...

  To manage the namespace entirely outside the chart, set:
    createNamespace: false
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "luks-trim.namespace" . }}
  labels:
    {{- include "luks-trim.labels" . | nindent 4 }}
    {{- with .Values.namespaceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
