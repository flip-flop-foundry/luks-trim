apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "luks-trim.serviceAccountName" . }}
  namespace: {{ include "luks-trim.namespace" . }}
  labels:
    {{- include "luks-trim.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: ServiceAccount used by the coordinator and per-node worker Jobs created by luks-trim.
    app.kubernetes.io/part-of: luks-trim
    app.kubernetes.io/component: service-account
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
# ClusterRole: cluster-scoped read/patch permissions required by luks-trim.
# - nodes/list: coordinator enumerates nodes to create one worker Job per node
# - persistentvolumes/get: worker resolves Longhorn PV -> PVC for key lookup
# - persistentvolumes/patch: optional, worker writes PV run-status annotations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "luks-trim.fullname" . }}-cluster-access
  labels:
    {{- include "luks-trim.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: Cluster-scoped permissions for node enumeration and optional Longhorn PersistentVolume status annotations.
    app.kubernetes.io/part-of: luks-trim
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  {{- if .Values.longhorn.enabled }}
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get"]
  {{- end }}
  {{- if and .Values.longhorn.enabled .Values.pvAnnotations.enabled }}
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "luks-trim.fullname" . }}-cluster-access
  labels:
    {{- include "luks-trim.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: Binds the luks-trim ServiceAccount to cluster-scoped node/PV access.
    app.kubernetes.io/part-of: luks-trim
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "luks-trim.fullname" . }}-cluster-access
subjects:
  - kind: ServiceAccount
    name: {{ include "luks-trim.serviceAccountName" . }}
    namespace: {{ include "luks-trim.namespace" . }}
---
# Role: coordinator creates one Job per node by listing/creating Jobs in the
# chart namespace. Completed Jobs are cleaned up automatically by Kubernetes
# TTLAfterFinished using .Values.ttlSecondsAfterFinished.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "luks-trim.fullname" . }}-job-manager
  namespace: {{ include "luks-trim.namespace" . }}
  labels:
    {{- include "luks-trim.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: Allows coordinator to create and inspect per-node worker Jobs in the chart namespace.
    app.kubernetes.io/part-of: luks-trim
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "luks-trim.fullname" . }}-job-manager
  namespace: {{ include "luks-trim.namespace" . }}
  labels:
    {{- include "luks-trim.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: Binds coordinator Job-management namespace Role to the luks-trim ServiceAccount.
    app.kubernetes.io/part-of: luks-trim
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "luks-trim.fullname" . }}-job-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "luks-trim.serviceAccountName" . }}
    namespace: {{ include "luks-trim.namespace" . }}

{{- if and .Values.longhorn.enabled .Values.longhorn.globalKey.enabled }}
---
# Role: read the global LUKS key secret.
# Created in the namespace where the secret lives (may differ from chart namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "luks-trim.fullname" . }}-global-key-reader
  namespace: {{ include "luks-trim.globalKeyNamespace" . }}
  labels:
    {{- include "luks-trim.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: Allows worker to read the configured global Longhorn encryption key secret.
    app.kubernetes.io/part-of: luks-trim
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.longhorn.globalKey.secretName | quote }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "luks-trim.fullname" . }}-global-key-reader
  namespace: {{ include "luks-trim.globalKeyNamespace" . }}
  labels:
    {{- include "luks-trim.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: Binds global Longhorn key secret-reader Role to the luks-trim ServiceAccount.
    app.kubernetes.io/part-of: luks-trim
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "luks-trim.fullname" . }}-global-key-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "luks-trim.serviceAccountName" . }}
    namespace: {{ include "luks-trim.namespace" . }}
{{- end }}

{{- if and .Values.longhorn.enabled .Values.longhorn.namespaceSecrets }}
{{- range .Values.longhorn.namespaceSecrets }}
---
# Role: read LUKS key secrets in namespace {{ .namespace }}.
# Covers both namespace-shared keys and per-PVC secrets listed under secretNames.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "luks-trim.fullname" $ }}-ns-key-{{ .namespace | trunc 20 | trimSuffix "-" }}
  namespace: {{ .namespace }}
  labels:
    {{- include "luks-trim.labels" $ | nindent 4 }}
  annotations:
    kubernetes.io/description: Allows worker to read configured Longhorn key secrets in namespace {{ .namespace }}.
    app.kubernetes.io/part-of: luks-trim
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range .secretNames }}
      - {{ . | quote }}
      {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "luks-trim.fullname" $ }}-ns-key-{{ .namespace | trunc 20 | trimSuffix "-" }}
  namespace: {{ .namespace }}
  labels:
    {{- include "luks-trim.labels" $ | nindent 4 }}
  annotations:
    kubernetes.io/description: Binds namespace Longhorn key secret-reader Role in {{ .namespace }} to the luks-trim ServiceAccount.
    app.kubernetes.io/part-of: luks-trim
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "luks-trim.fullname" $ }}-ns-key-{{ .namespace | trunc 20 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "luks-trim.serviceAccountName" $ }}
    namespace: {{ include "luks-trim.namespace" $ }}
{{- end }}
{{- end }}

{{- if and .Values.talos.enabled .Values.talos.staticKey.enabled .Values.talos.staticKey.secretName }}
---
# Role: read the Talos static LUKS passphrase secret.
# Created in the namespace where the secret lives (defaults to chart namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "luks-trim.fullname" . }}-talos-static-key-reader
  namespace: {{ include "luks-trim.staticKeyNamespace" . }}
  labels:
    {{- include "luks-trim.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: Allows worker to read the Talos static passphrase secret.
    app.kubernetes.io/part-of: luks-trim
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.talos.staticKey.secretName | quote }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "luks-trim.fullname" . }}-talos-static-key-reader
  namespace: {{ include "luks-trim.staticKeyNamespace" . }}
  labels:
    {{- include "luks-trim.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: Binds Talos static passphrase secret-reader Role to the luks-trim ServiceAccount.
    app.kubernetes.io/part-of: luks-trim
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "luks-trim.fullname" . }}-talos-static-key-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "luks-trim.serviceAccountName" . }}
    namespace: {{ include "luks-trim.namespace" . }}
{{- end }}