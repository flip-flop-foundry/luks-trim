apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "luks-trim.fullname" . }}
  namespace: {{ include "luks-trim.namespace" . }}
  labels:
    {{- include "luks-trim.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  {{- if .Values.timezone }}
  timeZone: {{ .Values.timezone | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished.coordinator }}
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "luks-trim.selectorLabels" . | nindent 12 }}
            luks-trim/role: coordinator
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          serviceAccountName: {{ include "luks-trim.serviceAccountName" . }}
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: coordinator
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- with .Values.coordinatorResources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              env:
                # Forwarded into each per-node Job so workers know what to process.
                - name: LONGHORN_ENABLED
                  value: {{ .Values.longhorn.enabled | toString | quote }}
                - name: TALOS_ENABLED
                  value: {{ .Values.talos.enabled | toString | quote }}
                - name: KMS_ENDPOINT
                  value: {{ include "luks-trim.kmsEndpoint" . | quote }}
                - name: GLOBAL_KEY_ENABLED
                  value: {{ (and .Values.longhorn.enabled .Values.longhorn.globalKey.enabled) | toString | quote }}
                - name: GLOBAL_KEY_NS
                  value: {{ include "luks-trim.globalKeyNamespace" . | quote }}
                - name: GLOBAL_KEY_SECRET
                  value: {{ .Values.longhorn.globalKey.secretName | quote }}
                - name: GLOBAL_KEY_FIELD
                  value: {{ .Values.longhorn.globalKey.secretKey | quote }}
                - name: LONGHORN_DEVICE_PATH
                  value: {{ .Values.longhorn.devicePath | quote }}
                - name: TALOS_STATIC_KEY_ENABLED
                  value: {{ (and .Values.talos.enabled .Values.talos.staticKey.enabled) | toString | quote }}
                - name: TALOS_STATIC_KEY_NS
                  value: {{ include "luks-trim.staticKeyNamespace" . | quote }}
                - name: TALOS_STATIC_KEY_SECRET
                  value: {{ .Values.talos.staticKey.secretName | quote }}
                - name: TALOS_STATIC_KEY_FIELD
                  value: {{ .Values.talos.staticKey.secretKey | quote }}
                {{- if and .Values.talos.enabled .Values.talos.machineConfig.enabled }}
                - name: TALOS_MC_PATH
                  value: /host-talos-state
                {{- end }}
                - name: CHART_NAMESPACE
                  value: {{ include "luks-trim.namespace" . | quote }}
                - name: WORKER_IMAGE
                  value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
                - name: WORKER_TTL
                  value: {{ .Values.ttlSecondsAfterFinished.worker | toString | quote }}
                - name: WORKER_IMAGE_PULL_POLICY
                  value: {{ .Values.image.pullPolicy | quote }}
                - name: SCRIPT_CONFIGMAP
                  value: {{ include "luks-trim.fullname" . }}-script
                - name: SA_NAME
                  value: {{ include "luks-trim.serviceAccountName" . | quote }}
                - name: DRY_RUN
                  value: {{ .Values.dryRun | toString | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  # All required tools (curl, jq) are pre-installed in the custom
                  # Ubuntu worker image — no runtime package downloads needed.

                  KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  KUBE_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  KUBE_API=https://kubernetes.default.svc
                  TS=$(date +%s)

                  echo "$(date) - luks-trim coordinator starting"
                  echo "  longhorn=${LONGHORN_ENABLED} talos=${TALOS_ENABLED}"

                  # Build the label-selector query parameter.
                  # nodeLabelSelector is baked in at render time; empty = no filter.
                  LABEL_SELECTOR={{ .Values.nodeLabelSelector | quote }}
                  if [ -n "$LABEL_SELECTOR" ]; then
                    NODE_URL="$KUBE_API/api/v1/nodes?labelSelector=$(printf '%s' "$LABEL_SELECTOR" | jq -sRr @uri)"
                  else
                    NODE_URL="$KUBE_API/api/v1/nodes"
                  fi

                  ALL_NODES=$(curl -sf --cacert "$KUBE_CA" \
                    -H "Authorization: Bearer $KUBE_TOKEN" \
                    "$NODE_URL" | jq -r '.items[].metadata.name')

                  [ -z "$ALL_NODES" ] && { echo "ERROR: no nodes returned from API"; exit 1; }

                  # Build excluded-nodes lookup (newline-separated list baked in at render time).
                  EXCLUDED_NODES={{ if .Values.excludedNodes }}{{ join "\n" .Values.excludedNodes | quote }}{{ else }}""{{ end }}

                  _submit_failed=0
                  for NODE in $ALL_NODES; do
                    # Apply excludedNodes denylist.
                    if printf '%s' "$EXCLUDED_NODES" | grep -qxF "$NODE"; then
                      echo "  Skipping excluded node: $NODE"
                      continue
                    fi

                    SAFE_NODE=$(printf '%s' "$NODE" | tr '[:upper:]' '[:lower:]' | tr '._' '--' | cut -c1-40)
                    JOB_NAME="luks-trim-${SAFE_NODE}-${TS}"
                    echo "  Submitting Job $JOB_NAME → $NODE"

                    TOLERATIONS_JSON={{ .Values.tolerations | toJson | squote }}
                    WORKER_RESOURCES_JSON={{ .Values.workerResources | toJson | squote }}
                    IMAGE_PULL_SECRETS_JSON={{ .Values.imagePullSecrets | toJson | squote }}
                    POD_ANNOTATIONS_JSON={{ .Values.podAnnotations | toJson | squote }}

                    JOB_SPEC=$(jq -n \
                      --arg name       "$JOB_NAME" \
                      --arg node       "$NODE" \
                      --arg ns         "$CHART_NAMESPACE" \
                      --arg ts         "$TS" \
                      --arg image      "$WORKER_IMAGE" \
                      --arg pullpol    "$WORKER_IMAGE_PULL_POLICY" \
                      --arg sa         "$SA_NAME" \
                      --arg cm         "$SCRIPT_CONFIGMAP" \
                      --argjson ttl    "$WORKER_TTL" \
                      --arg le         "$LONGHORN_ENABLED" \
                      --arg te         "$TALOS_ENABLED" \
                      --arg kms        "$KMS_ENDPOINT" \
                      --arg gke        "$GLOBAL_KEY_ENABLED" \
                      --arg gkns       "$GLOBAL_KEY_NS" \
                      --arg gksec      "$GLOBAL_KEY_SECRET" \
                      --arg gkfield    "$GLOBAL_KEY_FIELD" \
                      --arg devpath    "$LONGHORN_DEVICE_PATH" \
                      --arg dr         "$DRY_RUN" \
                      --arg tske       "$TALOS_STATIC_KEY_ENABLED" \
                      --arg tskns      "$TALOS_STATIC_KEY_NS" \
                      --arg tsksec     "$TALOS_STATIC_KEY_SECRET" \
                      --arg tskfield   "$TALOS_STATIC_KEY_FIELD" \
                      --arg mcpath     "${TALOS_MC_PATH:-}" \
                      --argjson tols   "$TOLERATIONS_JSON" \
                      --argjson res    "$WORKER_RESOURCES_JSON" \
                      --argjson ips    "$IMAGE_PULL_SECRETS_JSON" \
                      --argjson anns   "$POD_ANNOTATIONS_JSON" \
                      '{
                        apiVersion: "batch/v1",
                        kind: "Job",
                        metadata: {
                          name: $name,
                          namespace: $ns,
                          labels: {
                            "app.kubernetes.io/name": "luks-trim",
                            "luks-trim/role": "worker",
                            "luks-trim/run": $ts,
                            "luks-trim/node": $node
                          }
                        },
                        spec: {
                          ttlSecondsAfterFinished: $ttl,
                          backoffLimit: 0,
                          template: {
                            metadata: {
                              labels: {
                                "app.kubernetes.io/name": "luks-trim",
                                "luks-trim/role": "worker",
                                "luks-trim/node": $node
                              },
                              annotations: (if $anns | length > 0 then $anns else null end)
                            },
                            spec: {
                              nodeName: $node,
                              serviceAccountName: $sa,
                              hostPID: true,
                              restartPolicy: "Never",
                              tolerations: $tols,
                              imagePullSecrets: (if $ips | length > 0 then $ips else null end),
                              containers: [{
                                name: "luks-trim",
                                image: $image,
                                imagePullPolicy: $pullpol,
                                securityContext: {privileged: true},
                                resources: $res,
                                env: ([
                                  {name: "LONGHORN_ENABLED",           value: $le},
                                  {name: "TALOS_ENABLED",              value: $te},
                                  {name: "KMS_ENDPOINT",               value: $kms},
                                  {name: "GLOBAL_KEY_ENABLED",         value: $gke},
                                  {name: "GLOBAL_KEY_NS",              value: $gkns},
                                  {name: "GLOBAL_KEY_SECRET",          value: $gksec},
                                  {name: "GLOBAL_KEY_FIELD",           value: $gkfield},
                                  {name: "LONGHORN_DEVICE_PATH",       value: $devpath},
                                  {name: "DRY_RUN",                    value: $dr},
                                  {name: "TALOS_STATIC_KEY_ENABLED",   value: $tske},
                                  {name: "TALOS_STATIC_KEY_NS",        value: $tskns},
                                  {name: "TALOS_STATIC_KEY_SECRET",    value: $tsksec},
                                  {name: "TALOS_STATIC_KEY_FIELD",     value: $tskfield}
                                ] + (if $mcpath != "" then [{name: "TALOS_MC_PATH", value: $mcpath}] else [] end)),
                                command: ["/bin/sh", "/scripts/trim.sh"],
                                volumeMounts: ([
                                  {name: "dev",         mountPath: "/dev"},
                                  {name: "host-ssl",    mountPath: "/etc/ssl/certs", readOnly: true},
                                  {name: "trim-script", mountPath: "/scripts",       readOnly: true}
                                ] + (if $mcpath != "" then [{name: "host-talos-state", mountPath: $mcpath, readOnly: true}] else [] end))
                              }],
                              volumes: ([
                                {name: "dev",         hostPath: {path: "/dev"}},
                                {name: "host-ssl",    hostPath: {path: "/etc/ssl/certs", type: "Directory"}},
                                {name: "trim-script", configMap: {name: $cm, defaultMode: 493}}
                              ] + (if $mcpath != "" then [{name: "host-talos-state", hostPath: {path: {{ .Values.talos.machineConfig.hostPath | default "/system/state" | quote }}, type: "Directory"}}] else [] end))
                            }
                          }
                        }
                      }')

                    curl -sf -X POST \
                      --cacert "$KUBE_CA" \
                      -H "Authorization: Bearer $KUBE_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "$JOB_SPEC" \
                      "$KUBE_API/apis/batch/v1/namespaces/$CHART_NAMESPACE/jobs" \
                      && echo "    Created" \
                      || { echo "    [ERROR] Job creation failed for $NODE"; _submit_failed=$(( _submit_failed + 1 )); }
                  done

                  if [ "$_submit_failed" -gt 0 ]; then
                    echo "[ERROR] $_submit_failed per-node Job(s) failed to submit. Affected nodes did not run trim."
                    exit 1
                  fi
                  echo "$(date) - All per-node Jobs submitted. Workers self-delete after ${WORKER_TTL}s."
