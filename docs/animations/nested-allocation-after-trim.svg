<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
  <title id="title">Nested allocation after trim propagation</title>
  <desc id="desc">After allow-discards is enabled and trim runs, Longhorn, Talos, and VM disk allocation shrink after file deletion.</desc>

  <defs>
    <style>
      .bg { fill: #07161a; }
      .panel { fill: #0f252b; stroke: #3f747f; stroke-width: 2; rx: 12; }
      .label { fill: #d8fff8; font: 700 18px 'Segoe UI', Tahoma, sans-serif; }
      .small { fill: #a7ded4; font: 600 14px 'Segoe UI', Tahoma, sans-serif; }
      .ok { fill: #7dffbe; font: 700 16px 'Segoe UI', Tahoma, sans-serif; }
      .alloc { fill: #3ed598; }
      .logical { fill: #52d8ff; }
      .arrow { stroke: #8ccfc2; stroke-width: 2; marker-end: url(#arrowhead2); }
      .phase { fill: #d8fff8; font: 700 17px 'Segoe UI', Tahoma, sans-serif; }
    </style>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8ccfc2" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="460" rx="16" />

  <text class="label" x="30" y="38">With discard + trim propagation: allocation finally shrinks</text>

  <text class="phase" x="30" y="72" opacity="1">Phase 1/3: write files (+4 GiB)
    <animate attributeName="opacity" values="1;0;0;1" keyTimes="0;0.34;0.67;1" calcMode="discrete" dur="12s" repeatCount="indefinite" />
  </text>
  <text class="phase" x="30" y="72" opacity="0">Phase 2/3: delete files (-4 GiB)
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.34;0.67;1" calcMode="discrete" dur="12s" repeatCount="indefinite" />
  </text>
  <text class="phase" x="30" y="72" opacity="0">Phase 3/3: Longhorn trim + Talos fstrim reclaim
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.34;0.67;1" calcMode="discrete" dur="12s" repeatCount="indefinite" />
  </text>

  <rect class="panel" x="30" y="100" width="920" height="330" />

  <text class="small" x="70" y="142">Logical filesystem usage (inside volume)</text>
  <rect x="70" y="156" width="840" height="34" rx="8" fill="#12313a" stroke="#3d7986" />
  <rect class="logical" x="72" y="158" width="120" height="30" rx="7">
    <animate attributeName="width" values="120;700;120;120" keyTimes="0;0.3;0.58;1" dur="12s" repeatCount="indefinite" />
  </rect>

  <line class="arrow" x1="490" y1="196" x2="490" y2="225" />
  <line class="arrow" x1="490" y1="275" x2="490" y2="304" />
  <line class="arrow" x1="490" y1="354" x2="490" y2="383" />

  <g transform="translate(70,228)">
    <text class="small" x="0" y="-8">Longhorn volume allocation</text>
    <rect x="0" y="0" width="840" height="38" rx="8" fill="#12313a" stroke="#3d7986" />
    <rect class="alloc" x="2" y="2" width="120" height="34" rx="7">
      <animate attributeName="width" values="120;700;700;120" keyTimes="0;0.3;0.68;1" dur="12s" repeatCount="indefinite" />
    </rect>
  </g>

  <g transform="translate(70,307)">
    <text class="small" x="0" y="-8">Talos encrypted system allocation</text>
    <rect x="0" y="0" width="840" height="38" rx="8" fill="#12313a" stroke="#3d7986" />
    <rect class="alloc" x="2" y="2" width="120" height="34" rx="7" opacity="0.9">
      <animate attributeName="width" values="120;700;700;120" keyTimes="0;0.3;0.76;1" dur="12s" repeatCount="indefinite" />
    </rect>
  </g>

  <g transform="translate(70,386)">
    <text class="small" x="0" y="-8">VM host disk allocation (qcow2/raw sparse)</text>
    <rect x="0" y="0" width="840" height="38" rx="8" fill="#12313a" stroke="#3d7986" />
    <rect class="alloc" x="2" y="2" width="120" height="34" rx="7" opacity="0.85">
      <animate attributeName="width" values="120;700;700;120" keyTimes="0;0.3;0.84;1" dur="12s" repeatCount="indefinite" />
    </rect>
  </g>

  <text class="ok" x="648" y="90">Recovered: all nested layers shrink</text>
  <circle cx="628" cy="84" r="5" fill="#7dffbe">
    <animate attributeName="opacity" values="0;0;1;1;0.4;1" keyTimes="0;0.68;0.74;0.9;0.95;1" dur="12s" repeatCount="indefinite" />
  </circle>
</svg>
