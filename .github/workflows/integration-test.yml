# Integration tests for the luks-trim Helm chart.
#
# Infrastructure: QEMU-based Talos v1.13 single-node cluster on the GHA
# ubuntu-latest runner (nested KVM available).  Docker-based Talos is NOT
# used because Docker nodes run on overlayfs, which does not support the
# FITRIM ioctl – making it impossible to verify that fstrim actually frees
# host storage.
#
# Key test scenarios
# ──────────────────
# T1  Live run  – write 2 GiB → delete → run luks-trim (enables LUKS
#     allow-discards) → trigger Longhorn filesystem-trim CronJob →
#     assert Longhorn actualSize shrank.
#
# T2  Dry-run   – verify worker logs contain [dry-run] lines, no [ERROR]
#     lines, and Longhorn actualSize is unchanged.
#
# Trigger: workflow_dispatch only (not automated; QEMU cluster takes ~30 min).
# To gate PRs, add a `pull_request` trigger once the cluster setup time is
# acceptable for your CI budget.

name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      worker-image:
        description: >
          Worker image to test.
          Format: repository:tag  (e.g. ghcr.io/flip-flop-foundry/luks-trim/worker:sha-abc1234)
        required: false
        default: 'ghcr.io/flip-flop-foundry/luks-trim/worker:latest'
        type: string
      talos-version:
        description: >
          Talos version without the leading "v", e.g. 1.9.5.
          Leave blank to use the latest stable release.
        required: false
        default: ''
        type: string
      longhorn-version:
        description: >
          Longhorn Helm chart version (longhorn/longhorn).
          Leave blank to auto-detect and install the latest available release.
        required: false
        default: ''
        type: string

# Only one integration-test run at a time; a newer push cancels the old one.
concurrency:
  group: integration-test
  cancel-in-progress: true

env:
  CLUSTER_NAME: luks-trim-test
  # These paths are written by the cluster-create step and consumed by later
  # steps via the TALOSCONFIG / KUBECONFIG env vars picked up automatically
  # by talosctl / kubectl.
  TALOSCONFIG: ${{ github.workspace }}/talosconfig
  KUBECONFIG:  ${{ github.workspace }}/kubeconfig

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read          # checkout only; no writes back to the repo
    outputs:
      longhorn-version: ${{ steps.longhorn.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        if: ${{ false }} # Temporarily disabled to speed up workflow iteration.
        run: |
          echo "[info] disk usage before cleanup"
          df -h

          # Remove large, unused preinstalled toolchains from ubuntu-latest.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true

          docker system prune -af || true
          sudo apt-get clean || true

          echo "[info] disk usage after cleanup"
          df -h

      # ======================================================================
      # 1. SYSTEM DEPENDENCIES
      # ======================================================================

      - name: Install QEMU and KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y qemu-system-x86 qemu-kvm cpu-checker
          # ubuntu-latest GHA runners expose /dev/kvm via nested virtualisation.
          sudo chmod 666 /dev/kvm
          kvm-ok

      - name: Resolve Talos version
        id: talos
        run: |
          VER="${{ inputs.talos-version }}"
          if [[ -z "$VER" ]]; then
            VER=$(curl -sSfL https://api.github.com/repos/siderolabs/talos/releases/latest \
              | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Talos version: v${VER}"

      - name: Install talosctl
        run: |
          curl -sSfL \
            "https://github.com/siderolabs/talos/releases/download/v${{ steps.talos.outputs.version }}/talosctl-linux-amd64" \
            -o /usr/local/bin/talosctl
          chmod +x /usr/local/bin/talosctl
          talosctl version --client

      - name: Install kubectl
        run: |
          STABLE=$(curl -sSfL https://dl.k8s.io/release/stable.txt)
          curl -sSfL "https://dl.k8s.io/release/${STABLE}/bin/linux/amd64/kubectl" \
            -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm
        run: |
          curl -sSfL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      # ======================================================================
      # 2. TALOS IMAGE FACTORY — schematic with Longhorn system extensions
      #
      # The QEMU provisioner boots the standard Talos kernel/initramfs, then
      # runs the installer image written into machine.install.image.  By
      # pointing that field at a factory.talos.dev installer that embeds
      # iscsi-tools and util-linux-tools, the resulting OS has everything
      # Longhorn needs (iSCSI initiator, fstrim, blkid) without requiring
      # any runtime package installs inside the VM.
      # ======================================================================

      - name: Request Talos factory schematic (iscsi-tools + util-linux-tools)
        id: factory
        run: |
          # Write the schematic to a file to avoid indentation issues with
          # embedding YAML content inside this YAML block scalar.
          cat > /tmp/schematic.yaml <<'SCHEMATIC'
          customization:
            systemExtensions:
              officialExtensions:
                - siderolabs/iscsi-tools
                - siderolabs/util-linux-tools
          SCHEMATIC

          RESP=$(curl -sSfL \
            -X POST \
            -H 'Content-Type: application/yaml' \
            --data-binary @/tmp/schematic.yaml \
            https://factory.talos.dev/schematics)
          ID=$(echo "$RESP" | jq -r '.id')
          if [[ -z "$ID" || "$ID" == "null" ]]; then
            echo "[FAIL] Unexpected response from factory.talos.dev: $RESP"
            exit 1
          fi
          echo "id=${ID}" >> "$GITHUB_OUTPUT"
          echo "Schematic ID: ${ID}"

      # ======================================================================
      # 3. PROVISION TALOS QEMU CLUSTER
      #
      # Single-node (1 controlplane, 0 workers) to stay within the ~7 GiB RAM
      # of standard ubuntu-latest runners.  cluster.allowSchedulingOnControl-
      # Planes removes the NoSchedule taint so Longhorn and test pods can land.
      #
      # Disk: runner-capacity-aware. We size based on current free space under
      # ${HOME} to avoid qemu preallocation failures on busy ubuntu-latest hosts.
      #
      # The machine config patch injects:
      #   • machine.install.image  → factory installer with extensions
      #   • machine.files          → iSCSI initiator name (required by Longhorn)
      #   • cluster.allowSchedulingOnControlPlanes → removes NoSchedule taint
      # ======================================================================

      - name: Create Talos QEMU cluster
        env:
          TALOS_VERSION: ${{ steps.talos.outputs.version }}
          SCHEMATIC_ID:  ${{ steps.factory.outputs.id }}
        run: |
          cat > /tmp/mc-patch.yaml <<EOF
          cluster:
            allowSchedulingOnControlPlanes: true
          machine:
            install:
              image: factory.talos.dev/installer/${SCHEMATIC_ID}:v${TALOS_VERSION}
          EOF

          AVAILABLE_MIB=$(df -Pm "$HOME" | awk 'NR==2 {print $4}')
          if [[ -z "${AVAILABLE_MIB}" ]]; then
            echo "[FAIL] Could not determine free disk space under $HOME"
            exit 1
          fi

          # Keep generous host headroom so the runner can continue writing
          # logs/artifacts while the VM disk is preallocated.
          RESERVED_MIB=12288
          MIN_DISK_MIB=10240
          MAX_DISK_MIB=12288
          TALOS_DISK_MIB=$(( AVAILABLE_MIB - RESERVED_MIB ))

          if (( TALOS_DISK_MIB > MAX_DISK_MIB )); then
            TALOS_DISK_MIB=$MAX_DISK_MIB
          fi

          if (( TALOS_DISK_MIB < MIN_DISK_MIB )); then
            echo "[FAIL] Not enough free disk for Talos VM preallocation"
            echo "[diagnostic] available=${AVAILABLE_MIB}MiB reserved=${RESERVED_MIB}MiB required_min=${MIN_DISK_MIB}MiB"
            df -h "$HOME" || true
            exit 1
          fi

          echo "[info] host free space under $HOME: ${AVAILABLE_MIB}MiB"
          echo "[info] selected Talos disk size: ${TALOS_DISK_MIB}MiB"

          # GitHub Actions doesn't support running steps in parallel within
          # the same job, so we run a background heartbeat while Talos creates
          # the cluster. This prevents long periods of silent logs.
          MONITOR_START=$(date +%s)
          ROUTE_DIAG_DUMPED=0

          dump_network_diagnostics() {
            local target_node="${1:-}"

            echo "[diagnostic] network interfaces (brief):"
            ip -br addr || true
            echo "[diagnostic] network links (brief):"
            ip -br link || true
            echo "[diagnostic] route table:"
            ip route show || true
            echo "[diagnostic] bridge links:"
            bridge link show || true

            if [[ -n "${target_node}" ]]; then
              echo "[diagnostic] route lookup for ${target_node}:"
              ip route get "${target_node}" || true
            fi

            local cp_pid_file="${HOME}/.talos/clusters/${CLUSTER_NAME}/${CLUSTER_NAME}-controlplane-1.pid"
            if [[ -f "${cp_pid_file}" ]]; then
              local cp_pid
              cp_pid=$(cat "${cp_pid_file}" 2>/dev/null || true)
              echo "[diagnostic] controlplane pid file: ${cp_pid_file} -> ${cp_pid:-unknown}"
              if [[ -n "${cp_pid}" ]]; then
                ps -p "${cp_pid}" -o pid,ppid,stat,etime,command || true
              fi
            else
              echo "[diagnostic] controlplane pid file missing: ${cp_pid_file}"
            fi
          }

          monitor_talos_create() {
            while true; do
              NOW=$(date +%s)
              ELAPSED=$(( NOW - MONITOR_START ))
              echo "[monitor] $(date -u +%Y-%m-%dT%H:%M:%SZ) talos-create elapsed=${ELAPSED}s"

              QEMU_COUNT=$(pgrep -fc 'qemu-system|qemu-kvm' || true)
              echo "[monitor] qemu process count (system|kvm): ${QEMU_COUNT}"

              FREE_MIB=$(df -Pm "$HOME" | awk 'NR==2 {print $4}')
              echo "[monitor] host free space under $HOME: ${FREE_MIB:-unknown}MiB"

              RUNNER_TALOS_DIR="${HOME}/.talos/clusters/${CLUSTER_NAME}"
              ROOT_TALOS_DIR="/root/.talos/clusters/${CLUSTER_NAME}"
              TALOS_CFG=""
              if test -f "$TALOSCONFIG"; then
                TALOS_CFG="$TALOSCONFIG"
              fi

              if test -d "${RUNNER_TALOS_DIR}"; then
                if test -f "${RUNNER_TALOS_DIR}/talosconfig"; then
                  TALOS_CFG="${RUNNER_TALOS_DIR}/talosconfig"
                fi
              elif sudo test -d "${ROOT_TALOS_DIR}"; then
                echo "[monitor] talos state dir exists: ${ROOT_TALOS_DIR}"
                sudo ls -1 "${ROOT_TALOS_DIR}" || true
                if sudo test -f "${ROOT_TALOS_DIR}/talosconfig"; then
                  TALOS_CFG="${ROOT_TALOS_DIR}/talosconfig"
                fi
              else
                echo "[monitor] talos state dir not created yet"
              fi

              if [[ -n "${TALOS_CFG}" ]]; then
                echo "[monitor] talosconfig detected: ${TALOS_CFG}"

                if timeout --signal=TERM 10s sudo -E talosctl --talosconfig "${TALOS_CFG}" version >/tmp/talos-version-probe.log 2>&1; then
                  echo "[monitor] talosctl version probe: api reachable"
                else
                  VERSION_RC=$?
                  echo "[monitor] talosctl version probe rc=${VERSION_RC}"
                  tail -n 1 /tmp/talos-version-probe.log || true
                fi

                if timeout --signal=TERM 10s sudo -E talosctl --talosconfig "${TALOS_CFG}" health --wait-timeout 5s >/tmp/talos-health-probe.log 2>&1; then
                  echo "[monitor] talosctl health probe: healthy"
                else
                  HEALTH_RC=$?
                  echo "[monitor] talosctl health probe rc=${HEALTH_RC}"
                  tail -n 1 /tmp/talos-health-probe.log || true
                fi

                # Pull cluster and node status as soon as talosconfig exists so
                # bootstrap progress is visible before kubectl is available.
                TALOS_NODE=""
                if timeout --signal=TERM 10s sudo -E talosctl --talosconfig "${TALOS_CFG}" config info -o yaml >/tmp/talos-config-info.log 2>&1; then
                  TALOS_NODE=$(awk '
                    /^nodes:/ {in_nodes=1; in_endpoints=0; next}
                    /^endpoints:/ {in_endpoints=1; in_nodes=0; next}
                    /^[^[:space:]-]/ {in_nodes=0; in_endpoints=0}
                    in_nodes && $1 == "-" {print $2; exit}
                  ' /tmp/talos-config-info.log)

                  # Fallback: if nodes are not populated yet, use first endpoint host.
                  if [[ -z "${TALOS_NODE}" ]]; then
                    TALOS_NODE=$(awk '
                      /^endpoints:/ {in_endpoints=1; next}
                      /^[^[:space:]-]/ {in_endpoints=0}
                      in_endpoints && $1 == "-" {print $2; exit}
                    ' /tmp/talos-config-info.log | sed -E 's#^https?://##; s#:[0-9]+$##')
                  fi
                fi

                if [[ -n "${TALOS_NODE}" ]]; then
                  echo "[monitor] talos node target: ${TALOS_NODE}"

                  if timeout --signal=TERM 10s sudo -E talosctl --talosconfig "${TALOS_CFG}" --nodes "${TALOS_NODE}" get members >/tmp/talos-members-probe.log 2>&1; then
                    echo "[monitor] talosctl get members: ok"
                    sed -n '1,20p' /tmp/talos-members-probe.log || true
                  else
                    MEMBERS_RC=$?
                    echo "[monitor] talosctl get members rc=${MEMBERS_RC}"
                    sed -n '1,8p' /tmp/talos-members-probe.log || true

                    if [[ "${ROUTE_DIAG_DUMPED}" -eq 0 ]] && grep -q "no route to host" /tmp/talos-members-probe.log; then
                      echo "[monitor] first no-route-to-host observed during get members"
                      dump_network_diagnostics "${TALOS_NODE}"
                      ROUTE_DIAG_DUMPED=1
                    fi
                  fi

                  if timeout --signal=TERM 10s sudo -E talosctl --talosconfig "${TALOS_CFG}" --nodes "${TALOS_NODE}" get machinestatus >/tmp/talos-machinestatus-probe.log 2>&1; then
                    echo "[monitor] talosctl get machinestatus: ok"
                    sed -n '1,20p' /tmp/talos-machinestatus-probe.log || true
                  else
                    MACHINESTATUS_RC=$?
                    echo "[monitor] talosctl get machinestatus rc=${MACHINESTATUS_RC}"
                    sed -n '1,8p' /tmp/talos-machinestatus-probe.log || true

                    if [[ "${ROUTE_DIAG_DUMPED}" -eq 0 ]] && grep -q "no route to host" /tmp/talos-machinestatus-probe.log; then
                      echo "[monitor] first no-route-to-host observed during get machinestatus"
                      dump_network_diagnostics "${TALOS_NODE}"
                      ROUTE_DIAG_DUMPED=1
                    fi
                  fi
                else
                  echo "[monitor] talos node target unavailable yet"
                  sed -n '1,8p' /tmp/talos-config-info.log || true
                fi
              fi

              sleep 20
            done
          }

          cleanup_monitor() {
            if [[ -n "${MONITOR_PID:-}" ]]; then
              kill "${MONITOR_PID}" >/dev/null 2>&1 || true
              wait "${MONITOR_PID}" >/dev/null 2>&1 || true
            fi
          }

          monitor_talos_create &
          MONITOR_PID=$!
          trap cleanup_monitor EXIT

          # qemu provisioner requires root privileges on GitHub-hosted Linux
          # runners (CNI + hypervisor setup).
          # Guard with an explicit timeout so this step cannot hang forever.
          set +e
          timeout --signal=TERM 40m sudo --preserve-env=HOME talosctl cluster create qemu \
            --name          "$CLUSTER_NAME" \
            --controlplanes 1 \
            --workers       0 \
            --disks         "virtio:${TALOS_DISK_MIB}MiB" \
            --memory-controlplanes "4096MiB" \
            --cpus-controlplanes   "2.0" \
            --talos-version "v${TALOS_VERSION}" \
            --schematic-id  "${SCHEMATIC_ID}" \
            --config-patch-controlplanes @/tmp/mc-patch.yaml \
            --talosconfig-destination "$TALOSCONFIG"
          CREATE_RC=$?
          set -e

          cleanup_monitor
          trap - EXIT

          if [[ "${CREATE_RC}" -ne 0 ]]; then
            echo "[FAIL] talosctl cluster create failed with exit code ${CREATE_RC}"
            echo "[diagnostic] qemu processes:"
            ps -ef | grep -E "qemu-system|qemu-kvm|dnsmasq|tap|bridge" | grep -v grep || true
            echo "[diagnostic] host networking:"
            dump_network_diagnostics "${TALOS_NODE:-}"
            echo "[diagnostic] runner talos state tree (if present):"
            ls -R "${HOME}/.talos" || true
            echo "[diagnostic] /root/.talos tree (if present):"
            sudo ls -R /root/.talos || true
            echo "[diagnostic] controlplane log tail (if present):"
            tail -n 200 "${HOME}/.talos/clusters/${CLUSTER_NAME}/${CLUSTER_NAME}-controlplane-1.log" || true
            echo "[diagnostic] dhcpd/lb log tails (if present):"
            tail -n 80 "${HOME}/.talos/clusters/${CLUSTER_NAME}/dhcpd.log" || true
            tail -n 80 "${HOME}/.talos/clusters/${CLUSTER_NAME}/lb.log" || true
            exit "${CREATE_RC}"
          fi

          # Export kubeconfig to the workspace path consumed by later steps.
          # qemu create writes talosconfig directly to $TALOSCONFIG.
          if [[ ! -f "$TALOSCONFIG" ]]; then
            echo "[FAIL] Expected talosconfig not found at ${TALOSCONFIG}"
            exit 1
          fi

          # qemu create runs via sudo and may leave talosconfig unreadable by
          # the runner user; normalize ownership before using it.
          sudo chown "$(id -u):$(id -g)" "$TALOSCONFIG"

          TALOS_NODE=""
          if timeout --signal=TERM 10s talosctl --talosconfig "$TALOSCONFIG" config info -o yaml >/tmp/talos-config-info-postcreate.log 2>&1; then
            TALOS_NODE=$(awk '
              /^nodes:/ {in_nodes=1; in_endpoints=0; next}
              /^endpoints:/ {in_endpoints=1; in_nodes=0; next}
              /^[^[:space:]-]/ {in_nodes=0; in_endpoints=0}
              in_nodes && $1 == "-" {print $2; exit}
            ' /tmp/talos-config-info-postcreate.log)

            if [[ -z "${TALOS_NODE}" ]]; then
              TALOS_NODE=$(awk '
                /^endpoints:/ {in_endpoints=1; next}
                /^[^[:space:]-]/ {in_endpoints=0}
                in_endpoints && $1 == "-" {print $2; exit}
              ' /tmp/talos-config-info-postcreate.log | sed -E 's#^https?://##; s#:[0-9]+$##')
            fi
          fi

          if [[ -z "${TALOS_NODE}" ]]; then
            echo "[FAIL] Could not determine Talos node target from talosconfig"
            sed -n '1,40p' /tmp/talos-config-info-postcreate.log || true
            exit 1
          fi

          talosctl \
            --talosconfig "$TALOSCONFIG" \
            kubeconfig --nodes "$TALOS_NODE" --merge=false /tmp/kubeconfig
          sudo cp /tmp/kubeconfig "$KUBECONFIG"
          sudo chown "$(id -u):$(id -g)" "$KUBECONFIG"

      - name: Wait for node Ready
        run: |
          kubectl wait node --all --for=condition=Ready --timeout=10m
          kubectl get nodes -o wide

      # ======================================================================
      # 4. INSTALL LONGHORN
      #
      # defaultReplicaCount=1 — single node has nowhere to replicate.
      # ======================================================================

      - name: Install Longhorn
        id: longhorn
        run: |
          REQUESTED_VERSION="${{ inputs.longhorn-version }}"

          helm repo add longhorn https://charts.longhorn.io
          helm repo update

            # Longhorn components require privileged pod security context.
            kubectl create namespace longhorn-system --dry-run=client -o yaml | kubectl apply -f -
            kubectl label namespace longhorn-system \
              pod-security.kubernetes.io/enforce=privileged \
              pod-security.kubernetes.io/audit=privileged \
              pod-security.kubernetes.io/warn=privileged \
              --overwrite

          if [[ -n "$REQUESTED_VERSION" ]]; then
            LONGHORN_VERSION="$REQUESTED_VERSION"
            echo "Longhorn version source: workflow input"
          else
            LONGHORN_VERSION=$(helm search repo longhorn/longhorn --versions | awk 'NR==2 {print $2}')
            if [[ -z "$LONGHORN_VERSION" ]]; then
              echo "[FAIL] Could not detect latest Longhorn chart version from Helm repo"
              exit 1
            fi
            echo "Longhorn version source: auto-detected latest from Helm repo"
          fi

          echo "Installing Longhorn chart version: ${LONGHORN_VERSION}"
          echo "version=${LONGHORN_VERSION}" >> "$GITHUB_OUTPUT"

            set +e
            helm upgrade --install longhorn longhorn/longhorn \
            --namespace   longhorn-system \
            --version     "${LONGHORN_VERSION}" \
            --set         defaultSettings.defaultReplicaCount=1 \
            --wait \
            --timeout     20m >/tmp/longhorn-install.log 2>&1 &
            LONGHORN_HELM_PID=$!

            while kill -0 "${LONGHORN_HELM_PID}" >/dev/null 2>&1; do
              echo "[monitor] $(date -u +%Y-%m-%dT%H:%M:%SZ) longhorn install in progress"
              echo "[monitor] longhorn pods:"
              kubectl -n longhorn-system get pods -o wide || true
              echo "[monitor] longhorn deployments:"
              kubectl -n longhorn-system get deploy || true
              echo "[monitor] longhorn daemonsets/statefulsets:"
              kubectl -n longhorn-system get ds,sts || true
              echo "[monitor] recent longhorn events:"
              kubectl -n longhorn-system get events --sort-by=.lastTimestamp | tail -n 30 || true
              sleep 20
            done

            wait "${LONGHORN_HELM_PID}"
            HELM_RC=$?
            set -e

            if [[ "${HELM_RC}" -ne 0 ]]; then
              echo "[FAIL] Longhorn helm install failed with exit code ${HELM_RC}"
              echo "[diagnostic] helm output:"
              sed -n '1,220p' /tmp/longhorn-install.log || true
              echo "[diagnostic] longhorn events:"
              kubectl -n longhorn-system get events --sort-by=.lastTimestamp | tail -n 80 || true
              exit "${HELM_RC}"
            fi

          echo "Installed Longhorn chart version: ${LONGHORN_VERSION}"
          {
            echo "### Longhorn Chart Version"
            if [[ -n "$REQUESTED_VERSION" ]]; then
              echo "- Requested via workflow input: ${REQUESTED_VERSION}"
            else
              echo "- Requested via workflow input: <empty>"
            fi
            echo "- Installed chart version: ${LONGHORN_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"

            kubectl -n longhorn-system get pods -o wide
            kubectl -n longhorn-system get deploy

      - name: Create Longhorn filesystem-trim RecurringJob (dormant by default)
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: longhorn.io/v1beta2
          kind: RecurringJob
          metadata:
            name: ci-filesystem-trim
            namespace: longhorn-system
          spec:
            cron: "0 0 1 1 *"
            task: "filesystem-trim"
            groups:
            - default
            retain: 1
            concurrency: 1
            labels: {}
          EOF

          kubectl get recurringjobs.longhorn.io -n longhorn-system ci-filesystem-trim -o yaml | sed -n '1,80p'

      # ======================================================================
      # 5. TEST FIXTURES
      # ======================================================================

      - name: Create test namespace and Longhorn key secrets
        run: |
          kubectl create namespace luks-trim-test --dry-run=client -o yaml | kubectl apply -f -

          # Distinct passphrases per test class so key-lookup paths are testable.
          GLOBAL_PASSPHRASE=$(openssl rand -base64 32)
          NS_PASSPHRASE=$(openssl rand -base64 32)
          PVC_PASSPHRASE=$(openssl rand -base64 32)

          # Global key secret (longhorn-system namespace).
          kubectl create secret generic longhorn-crypto \
            --namespace longhorn-system \
            --from-literal=CRYPTO_KEY_VALUE="${GLOBAL_PASSPHRASE}" \
            --from-literal=CRYPTO_KEY_PROVIDER=secret \
            --from-literal=CRYPTO_KEY_CIPHER=aes-xts-plain64 \
            --from-literal=CRYPTO_KEY_HASH=sha256 \
            --from-literal=CRYPTO_KEY_SIZE=256 \
            --from-literal=CRYPTO_PBKDF=argon2i

          # Namespace-shared key secret (luks-trim-test namespace).
          kubectl create secret generic luks-ns-shared \
            --namespace luks-trim-test \
            --from-literal=CRYPTO_KEY_VALUE="${NS_PASSPHRASE}" \
            --from-literal=CRYPTO_KEY_PROVIDER=secret \
            --from-literal=CRYPTO_KEY_CIPHER=aes-xts-plain64 \
            --from-literal=CRYPTO_KEY_HASH=sha256 \
            --from-literal=CRYPTO_KEY_SIZE=256 \
            --from-literal=CRYPTO_PBKDF=argon2i

          # Per-PVC key secret. Name must match the PVC name for per-PVC lookup tests.
          kubectl create secret generic t3-pvc-vol \
            --namespace luks-trim-test \
            --from-literal=CRYPTO_KEY_VALUE="${PVC_PASSPHRASE}" \
            --from-literal=CRYPTO_KEY_PROVIDER=secret \
            --from-literal=CRYPTO_KEY_CIPHER=aes-xts-plain64 \
            --from-literal=CRYPTO_KEY_HASH=sha256 \
            --from-literal=CRYPTO_KEY_SIZE=256 \
            --from-literal=CRYPTO_PBKDF=argon2i

      - name: Create Longhorn StorageClasses
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: luks-global-key
          provisioner: driver.longhorn.io
          allowVolumeExpansion: true
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          parameters:
            numberOfReplicas: "1"
            staleReplicaTimeout: "2880"
            fromBackup: ""
            fsType: ext4
            encrypted: "true"
            csi.storage.k8s.io/provisioner-secret-name:      longhorn-crypto
            csi.storage.k8s.io/provisioner-secret-namespace: longhorn-system
            csi.storage.k8s.io/node-publish-secret-name:     longhorn-crypto
            csi.storage.k8s.io/node-publish-secret-namespace: longhorn-system
            csi.storage.k8s.io/node-stage-secret-name:       longhorn-crypto
            csi.storage.k8s.io/node-stage-secret-namespace:  longhorn-system
            csi.storage.k8s.io/node-expand-secret-name:      longhorn-crypto
            csi.storage.k8s.io/node-expand-secret-namespace: longhorn-system
          ---
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: luks-ns-key
          provisioner: driver.longhorn.io
          allowVolumeExpansion: true
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          parameters:
            numberOfReplicas: "1"
            staleReplicaTimeout: "2880"
            fromBackup: ""
            fsType: ext4
            encrypted: "true"
            csi.storage.k8s.io/provisioner-secret-name:      luks-ns-shared
            csi.storage.k8s.io/provisioner-secret-namespace: ${pvc.namespace}
            csi.storage.k8s.io/node-publish-secret-name:     luks-ns-shared
            csi.storage.k8s.io/node-publish-secret-namespace: ${pvc.namespace}
            csi.storage.k8s.io/node-stage-secret-name:       luks-ns-shared
            csi.storage.k8s.io/node-stage-secret-namespace:  ${pvc.namespace}
            csi.storage.k8s.io/node-expand-secret-name:      luks-ns-shared
            csi.storage.k8s.io/node-expand-secret-namespace: ${pvc.namespace}
          ---
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: luks-pvc-key
          provisioner: driver.longhorn.io
          allowVolumeExpansion: true
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          parameters:
            numberOfReplicas: "1"
            staleReplicaTimeout: "2880"
            fromBackup: ""
            fsType: ext4
            encrypted: "true"
            csi.storage.k8s.io/provisioner-secret-name:      ${pvc.name}
            csi.storage.k8s.io/provisioner-secret-namespace: ${pvc.namespace}
            csi.storage.k8s.io/node-publish-secret-name:     ${pvc.name}
            csi.storage.k8s.io/node-publish-secret-namespace: ${pvc.namespace}
            csi.storage.k8s.io/node-stage-secret-name:       ${pvc.name}
            csi.storage.k8s.io/node-stage-secret-namespace:  ${pvc.namespace}
            csi.storage.k8s.io/node-expand-secret-name:      ${pvc.name}
            csi.storage.k8s.io/node-expand-secret-namespace: ${pvc.namespace}
          ---
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: no-encryption
          provisioner: driver.longhorn.io
          allowVolumeExpansion: true
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          parameters:
            numberOfReplicas: "1"
            staleReplicaTimeout: "2880"
            fromBackup: ""
            fsType: ext4
            encrypted: "false"
          EOF

      - name: Create test PVC and filler pod
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: test-vol
            namespace: luks-trim-test
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: luks-global-key
            resources:
              requests:
                storage: 5Gi
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: filler
            namespace: luks-trim-test
          spec:
            containers:
              - name: filler
                image: ubuntu:24.04
                command: ["sleep", "3600"]
                volumeMounts:
                  - name: data
                    mountPath: /data
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: test-vol
            restartPolicy: Never
          EOF

          kubectl wait pod/filler -n luks-trim-test \
            --for=condition=Ready --timeout=5m

      # ======================================================================
      # 6. INSTALL luks-trim CHART
      #
      # globalKey mode: a single secret covers all encrypted Longhorn volumes.
      # The schedule is set to a far-future cron so it never fires automatically;
      # test steps trigger runs with `kubectl create job --from=cronjob/...`.
      # ======================================================================

      - name: Install luks-trim chart
        run: |
          IMAGE="${{ inputs.worker-image }}"
          kubectl create namespace luks-trim --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace luks-trim \
            pod-security.kubernetes.io/enforce=privileged \
            pod-security.kubernetes.io/audit=privileged \
            pod-security.kubernetes.io/warn=privileged \
            --overwrite

          # Split "repo:tag"; if no colon is present, default tag to "latest".
          if [[ "$IMAGE" == *:* ]]; then
            REPO="${IMAGE%:*}"
            TAG="${IMAGE##*:}"
          else
            REPO="$IMAGE"
            TAG="latest"
          fi

          helm upgrade --install luks-trim . \
            --namespace   luks-trim \
            --create-namespace \
            --set image.repository="${REPO}" \
            --set image.tag="${TAG}" \
            --set longhorn.enabled=true \
            --set longhorn.globalKey.enabled=true \
            --set longhorn.globalKey.secretName=longhorn-crypto \
            --set longhorn.globalKey.secretNamespace=longhorn-system \
            --set-json 'longhorn.namespaceSecrets=[{"namespace":"luks-trim-test","secretNames":["luks-ns-shared","t3-pvc-vol"]}]' \
            --set talos.enabled=false \
            --set dryRun=false \
            --set 'schedule=0 3 1 1 *'   # dormant; jobs triggered manually

          kubectl -n luks-trim get all

      # ======================================================================
      # T1 — LIVE RUN
      #
      # 1. Write 2 GiB → assert Longhorn actualSize grew
      # 2. Delete file  → assert actualSize did NOT automatically shrink
      # 3. Run luks-trim cronjob manually
      # 4. Trigger Longhorn filesystem-trim CronJob manually
      # 5. Assert actualSize shrank (hard fail if < 1 GiB reclaimed)
      # ======================================================================

      - name: "[T1] Write 2 GiB to encrypted volume"
        run: |
          kubectl exec filler -n luks-trim-test -- \
            dd if=/dev/urandom of=/data/testfile bs=1M count=2048 status=progress
          kubectl exec filler -n luks-trim-test -- sync

      - name: "[T1] Capture Longhorn actualSize after write"
        id: baseline
        run: |
          # Allow Longhorn replica accounting to settle.
          sleep 15

          VOL_NAME=$(kubectl get pvc test-vol -n luks-trim-test \
            -o jsonpath='{.spec.volumeName}')
          echo "vol_name=${VOL_NAME}" >> "$GITHUB_OUTPUT"

          SIZE=$(kubectl get volume.longhorn.io "${VOL_NAME}" \
            -n longhorn-system -o jsonpath='{.status.actualSize}')
          echo "size_after_write=${SIZE}" >> "$GITHUB_OUTPUT"
          echo "Longhorn actualSize after 2 GiB write: ${SIZE} bytes"

          if [[ "${SIZE}" -lt $((1500 * 1024 * 1024)) ]]; then
            echo "[FAIL] actualSize ${SIZE} is below 1.5 GiB after a 2 GiB write"
            exit 1
          fi

      - name: "[T1] Delete file – assert no automatic storage reclaim"
        id: pre-trim
        run: |
          kubectl exec filler -n luks-trim-test -- rm /data/testfile
          kubectl exec filler -n luks-trim-test -- sync
          sleep 15

          VOL_NAME="${{ steps.baseline.outputs.vol_name }}"
          SIZE=$(kubectl get volume.longhorn.io "${VOL_NAME}" \
            -n longhorn-system -o jsonpath='{.status.actualSize}')
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          echo "actualSize after delete (before trim): ${SIZE} bytes"

          WRITE_SIZE="${{ steps.baseline.outputs.size_after_write }}"
          FLOOR=$(( WRITE_SIZE * 90 / 100 ))   # allow ≤10 % natural churn
          if [[ "$SIZE" -lt "$FLOOR" ]]; then
            echo "[WARN] actualSize dropped more than 10 % before trim – " \
                 "TRIM may already be flowing (LUKS allow-discards was already set?)"
          fi

      - name: "[T1] Run luks-trim (live)"
        id: live-run
        run: |
          TS=$(date +%s)
          JOB="luks-trim-live-${TS}"
          echo "job=${JOB}" >> "$GITHUB_OUTPUT"

          print_console_logs() {
            local section="$1"
            local selector="$2"
            echo "===== [logs:${section}] BEGIN ====="
            kubectl logs -n luks-trim -l "$selector" --prefix=true --tail=-1 || true
            echo "===== [logs:${section}] END ====="
          }

          print_namespace_events() {
            local section="$1"
            echo "===== [events:${section}] BEGIN ====="
            kubectl -n luks-trim get events --sort-by=.lastTimestamp | tail -n 80 || true
            echo "===== [events:${section}] END ====="
          }

          kubectl create job "${JOB}" --from=cronjob/luks-trim -n luks-trim

          # Poll coordinator progress with concise status output.
          COORD_DEADLINE=$(( SECONDS + 300 ))
          while true; do
            COORD_SUCCEEDED=$(kubectl get "job/${JOB}" -n luks-trim -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)
            COORD_FAILED=$(kubectl get "job/${JOB}" -n luks-trim -o jsonpath='{.status.failed}' 2>/dev/null || echo 0)
            COORD_ACTIVE=$(kubectl get "job/${JOB}" -n luks-trim -o jsonpath='{.status.active}' 2>/dev/null || echo 0)

            echo "[monitor] coordinator ${JOB}: active=${COORD_ACTIVE:-0} succeeded=${COORD_SUCCEEDED:-0} failed=${COORD_FAILED:-0}"
            kubectl get pods -n luks-trim -l "job-name=${JOB}" \
              -o custom-columns='NAME:.metadata.name,PHASE:.status.phase,READY:.status.containerStatuses[*].ready,RESTARTS:.status.containerStatuses[*].restartCount' \
              --no-headers 2>/dev/null || true

            if (( ${COORD_SUCCEEDED:-0} >= 1 )); then
              break
            fi

            if (( ${COORD_FAILED:-0} >= 1 )); then
              echo "[FAIL] Coordinator job ${JOB} failed"
              kubectl get "job/${JOB}" -n luks-trim -o wide || true
              kubectl get pods -n luks-trim -l "job-name=${JOB}" -o wide || true
              print_console_logs "coordinator-failed" "job-name=${JOB}"
              print_namespace_events "coordinator-failed"
              exit 1
            fi

            if [[ $SECONDS -ge $COORD_DEADLINE ]]; then
              echo "[FAIL] Coordinator job ${JOB} did not complete within timeout"
              kubectl get "job/${JOB}" -n luks-trim -o wide || true
              kubectl get pods -n luks-trim -l "job-name=${JOB}" -o wide || true
              print_console_logs "coordinator-timeout" "job-name=${JOB}"
              print_namespace_events "coordinator-timeout"
              exit 1
            fi

            sleep 15
          done

          print_console_logs "coordinator" "job-name=${JOB}"

          echo "Coordinator complete; waiting for worker Job to appear…"
          # The coordinator creates one worker Job per node. Poll until it
          # exists, then capture its name so later steps use only THIS run's
          # worker (not Jobs from earlier or later runs).
          DEADLINE=$(( SECONDS + 60 ))
          WORKER_JOB=""
          until [[ $SECONDS -ge $DEADLINE ]]; do
            WORKER_JOB=$(kubectl get jobs -n luks-trim \
              -l "luks-trim/role=worker" \
              --sort-by='.metadata.creationTimestamp' \
              -o name 2>/dev/null | tail -1 | sed 's|job.batch/||')
            [[ -n "$WORKER_JOB" ]] && break
            sleep 3
          done

          if [[ -z "$WORKER_JOB" ]]; then
            echo "[FAIL] No worker Job appeared within 60 s of coordinator completing"
            print_namespace_events "worker-missing"
            exit 1
          fi
          echo "worker_job=${WORKER_JOB}" >> "$GITHUB_OUTPUT"
          echo "Worker Job: ${WORKER_JOB}"

          WORKER_DEADLINE=$(( SECONDS + 300 ))
          while true; do
            WORKER_SUCCEEDED=$(kubectl get "job/${WORKER_JOB}" -n luks-trim -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)
            WORKER_FAILED=$(kubectl get "job/${WORKER_JOB}" -n luks-trim -o jsonpath='{.status.failed}' 2>/dev/null || echo 0)
            WORKER_ACTIVE=$(kubectl get "job/${WORKER_JOB}" -n luks-trim -o jsonpath='{.status.active}' 2>/dev/null || echo 0)

            echo "[monitor] worker ${WORKER_JOB}: active=${WORKER_ACTIVE:-0} succeeded=${WORKER_SUCCEEDED:-0} failed=${WORKER_FAILED:-0}"
            kubectl get pods -n luks-trim -l "job-name=${WORKER_JOB}" \
              -o custom-columns='NAME:.metadata.name,PHASE:.status.phase,READY:.status.containerStatuses[*].ready,RESTARTS:.status.containerStatuses[*].restartCount' \
              --no-headers 2>/dev/null || true

            if (( ${WORKER_SUCCEEDED:-0} >= 1 )) || (( ${WORKER_FAILED:-0} >= 1 )); then
              break
            fi

            if [[ $SECONDS -ge $WORKER_DEADLINE ]]; then
              echo "[FAIL] Worker job ${WORKER_JOB} did not complete within timeout"
              kubectl get "job/${WORKER_JOB}" -n luks-trim -o wide || true
              kubectl get pods -n luks-trim -l "job-name=${WORKER_JOB}" -o wide || true
              print_console_logs "worker-timeout" "job-name=${WORKER_JOB}"
              print_namespace_events "worker-timeout"
              exit 1
            fi

            sleep 15
          done

          echo "[diagnostic] worker job/pods:"
          kubectl get "job/${WORKER_JOB}" -n luks-trim -o wide || true
          kubectl get pods -n luks-trim -l "job-name=${WORKER_JOB}" -o wide || true
          print_console_logs "worker" "job-name=${WORKER_JOB}"
          print_namespace_events "worker-final"

      - name: "[T1] Assert worker pods exited 0 and contain no [ERROR] lines"
        run: |
          WORKER_JOB="${{ steps.live-run.outputs.worker_job }}"

          print_worker_termination_details() {
            local job_name="$1"
            echo "[diagnostic] worker termination details for ${job_name}:"
            kubectl get pods -n luks-trim -l "job-name=${job_name}" \
              -o jsonpath='{range .items[*]}{.metadata.name}{" phase="}{.status.phase}{" podReason="}{.status.reason}{" termReason="}{.status.containerStatuses[0].state.terminated.reason}{" exitCode="}{.status.containerStatuses[0].state.terminated.exitCode}{"\n"}{end}' || true

            for POD in $(kubectl get pods -n luks-trim -l "job-name=${job_name}" -o name 2>/dev/null); do
              echo "[diagnostic] ${POD} container status excerpt:"
              kubectl describe -n luks-trim "${POD}" | sed -n '/^Containers:/,/^Conditions:/p' || true
            done
          }

          WORKER_LOGS=$(kubectl logs -n luks-trim \
            -l "job-name=${WORKER_JOB}" --tail=-1 2>/dev/null)

          ERROR_COUNT=$(echo "$WORKER_LOGS" | grep -c '\[ERROR\]' || true)
          echo "[INFO] lines in worker logs: ${ERROR_COUNT}"
          if [[ "${ERROR_COUNT}" -gt 0 ]]; then
            echo "[FAIL] Worker pod logged ERROR lines:"
            echo "$WORKER_LOGS" | grep '\[ERROR\]'
            exit 1
          fi

          JOB_FAILED=$(kubectl get job "${WORKER_JOB}" -n luks-trim \
            -o jsonpath='{.status.failed}' 2>/dev/null || echo 0)
          if [[ "${JOB_FAILED}" -gt 0 ]]; then
            echo "[FAIL] Worker Job ${WORKER_JOB} has ${JOB_FAILED} failed pod(s)"
            print_worker_termination_details "${WORKER_JOB}"
            echo "$WORKER_LOGS"
            exit 1
          fi

          echo "[PASS] Worker pod exited 0; no error lines found"

      - name: "[T1] Trigger Longhorn filesystem-trim CronJob"
        run: |
          CRONJOB_NAME="ci-filesystem-trim"
          TRIGGER_JOB="${CRONJOB_NAME}-manual-$(date +%s)"

          if ! kubectl -n longhorn-system get cronjob "${CRONJOB_NAME}" >/dev/null 2>&1; then
            echo "[FAIL] Expected Longhorn CronJob ${CRONJOB_NAME} was not found"
            echo "[diagnostic] available CronJobs in longhorn-system:"
            kubectl -n longhorn-system get cronjobs || true
            exit 1
          fi

          kubectl -n longhorn-system create job "${TRIGGER_JOB}" --from=cronjob/"${CRONJOB_NAME}"

          if ! kubectl -n longhorn-system wait --for=condition=complete "job/${TRIGGER_JOB}" --timeout=5m; then
            echo "[FAIL] Triggered Longhorn trim job ${TRIGGER_JOB} did not complete"
            kubectl -n longhorn-system get "job/${TRIGGER_JOB}" -o wide || true
            kubectl -n longhorn-system get pods -l "job-name=${TRIGGER_JOB}" -o wide || true
            kubectl -n longhorn-system logs -l "job-name=${TRIGGER_JOB}" --tail=-1 || true
            kubectl -n longhorn-system get events --sort-by=.lastTimestamp | tail -n 120 || true
            exit 1
          fi

          echo "[diagnostic] Longhorn trim trigger job logs:"
          kubectl -n longhorn-system logs -l "job-name=${TRIGGER_JOB}" --tail=-1 || true

          echo "[diagnostic] recent longhorn events after trim trigger:"
          kubectl -n longhorn-system get events --sort-by=.lastTimestamp | tail -n 60 || true

      - name: "[T1] Assert Longhorn actualSize shrank after luks-trim"
        run: |
          # Allow Longhorn replica accounting to settle after worker completion.
          sleep 30

          VOL_NAME="${{ steps.baseline.outputs.vol_name }}"
          SIZE_NOW=$(kubectl get volume.longhorn.io "${VOL_NAME}" \
            -n longhorn-system -o jsonpath='{.status.actualSize}')
          PRE_TRIM="${{ steps.pre-trim.outputs.size }}"

          echo "pre-trim actualSize : ${PRE_TRIM} bytes"
          echo "post-trim actualSize: ${SIZE_NOW} bytes"

          RECLAIMED=$(( PRE_TRIM - SIZE_NOW ))
          echo "Reclaimed: ${RECLAIMED} bytes"

          # Enforce reclaim expectation as a hard gate for this workflow.
          MIN_RECLAIM=$(( 1024 * 1024 * 1024 ))
          if [[ "${RECLAIMED}" -lt "${MIN_RECLAIM}" ]]; then
            echo "[FAIL] Less than 1 GiB reclaimed (${RECLAIMED} bytes)."
            echo "       Expected Longhorn filesystem-trim to reclaim at least ${MIN_RECLAIM} bytes."
            exit 1
          fi

          echo "[PASS] ${RECLAIMED} bytes freed – TRIM propagated end-to-end"

      # ======================================================================
      # T2 — DRY-RUN
      #
      # 1. Upgrade chart with dryRun=true
      # 2. Write fresh data (gives the worker something to report on)
      # 3. Trigger luks-trim
      # 4. Assert worker logs contain [dry-run] lines and no [ERROR] lines
      # 5. Assert Longhorn actualSize did NOT change (no fstrim was issued)
      # ======================================================================

      - name: "[T2] Upgrade chart: dryRun=true"
        run: |
          helm upgrade luks-trim . \
            --namespace   luks-trim \
            --reuse-values \
            --set dryRun=true

      - name: "[T2] Write 512 MiB of fresh data"
        run: |
          kubectl exec filler -n luks-trim-test -- \
            dd if=/dev/urandom of=/data/dryrun-file bs=1M count=512 status=progress
          kubectl exec filler -n luks-trim-test -- sync

      - name: "[T2] Capture actualSize before dry run"
        id: dryrun-before
        run: |
          sleep 10
          VOL_NAME="${{ steps.baseline.outputs.vol_name }}"
          SIZE=$(kubectl get volume.longhorn.io "${VOL_NAME}" \
            -n longhorn-system -o jsonpath='{.status.actualSize}')
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          echo "actualSize before dry run: ${SIZE} bytes"

      - name: "[T2] Run luks-trim (dry-run)"
        id: dry-run-job
        run: |
          TS=$(date +%s)
          JOB="luks-trim-dryrun-${TS}"
          echo "job=${JOB}" >> "$GITHUB_OUTPUT"

          # Snapshot existing worker jobs BEFORE creating the dry-run coordinator.
          PREV_JOBS=$(kubectl get jobs -n luks-trim \
            -l "luks-trim/role=worker" -o name 2>/dev/null | sort)

          print_console_logs() {
            local section="$1"
            local selector="$2"
            echo "===== [logs:${section}] BEGIN ====="
            kubectl logs -n luks-trim -l "$selector" --prefix=true --tail=-1 || true
            echo "===== [logs:${section}] END ====="
          }

          print_namespace_events() {
            local section="$1"
            echo "===== [events:${section}] BEGIN ====="
            kubectl -n luks-trim get events --sort-by=.lastTimestamp | tail -n 80 || true
            echo "===== [events:${section}] END ====="
          }

          kubectl create job "${JOB}" --from=cronjob/luks-trim -n luks-trim
          COORD_DEADLINE=$(( SECONDS + 300 ))
          while true; do
            COORD_SUCCEEDED=$(kubectl get "job/${JOB}" -n luks-trim -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)
            COORD_FAILED=$(kubectl get "job/${JOB}" -n luks-trim -o jsonpath='{.status.failed}' 2>/dev/null || echo 0)
            COORD_ACTIVE=$(kubectl get "job/${JOB}" -n luks-trim -o jsonpath='{.status.active}' 2>/dev/null || echo 0)

            echo "[monitor] dry-run coordinator ${JOB}: active=${COORD_ACTIVE:-0} succeeded=${COORD_SUCCEEDED:-0} failed=${COORD_FAILED:-0}"
            kubectl get pods -n luks-trim -l "job-name=${JOB}" \
              -o custom-columns='NAME:.metadata.name,PHASE:.status.phase,READY:.status.containerStatuses[*].ready,RESTARTS:.status.containerStatuses[*].restartCount' \
              --no-headers 2>/dev/null || true

            if (( ${COORD_SUCCEEDED:-0} >= 1 )); then
              break
            fi

            if (( ${COORD_FAILED:-0} >= 1 )); then
              echo "[FAIL] Dry-run coordinator job ${JOB} failed"
              kubectl get "job/${JOB}" -n luks-trim -o wide || true
              kubectl get pods -n luks-trim -l "job-name=${JOB}" -o wide || true
              print_console_logs "dryrun-coordinator-failed" "job-name=${JOB}"
              print_namespace_events "dryrun-coordinator-failed"
              exit 1
            fi

            if [[ $SECONDS -ge $COORD_DEADLINE ]]; then
              echo "[FAIL] Dry-run coordinator job ${JOB} did not complete within timeout"
              kubectl get "job/${JOB}" -n luks-trim -o wide || true
              kubectl get pods -n luks-trim -l "job-name=${JOB}" -o wide || true
              print_console_logs "dryrun-coordinator-timeout" "job-name=${JOB}"
              print_namespace_events "dryrun-coordinator-timeout"
              exit 1
            fi

            sleep 15
          done

          print_console_logs "dryrun-coordinator" "job-name=${JOB}"

          # Find the worker Job created by this coordinator run.
          DEADLINE=$(( SECONDS + 60 ))
          WORKER_JOB=""
          until [[ $SECONDS -ge $DEADLINE ]]; do
            for NEW_JOB in $(kubectl get jobs -n luks-trim \
              -l "luks-trim/role=worker" \
              --sort-by='.metadata.creationTimestamp' \
              -o name 2>/dev/null | sed 's|job.batch/||'); do
              # Accept any worker job not present in the pre-run snapshot.
              if ! echo "$PREV_JOBS" | grep -qF "job.batch/${NEW_JOB}"; then
                WORKER_JOB="$NEW_JOB"
              fi
            done
            [[ -n "$WORKER_JOB" ]] && break
            sleep 3
          done

          if [[ -z "$WORKER_JOB" ]]; then
            echo "[FAIL] No new worker Job appeared within 60 s"
            echo "[diagnostic] worker jobs before dry-run coordinator:"
            echo "$PREV_JOBS"
            echo "[diagnostic] current worker jobs:"
            kubectl get jobs -n luks-trim -l "luks-trim/role=worker" \
              --sort-by='.metadata.creationTimestamp' -o wide || true
            print_namespace_events "dryrun-worker-missing"
            exit 1
          fi
          echo "worker_job=${WORKER_JOB}" >> "$GITHUB_OUTPUT"
          echo "Dry-run worker Job: ${WORKER_JOB}"

          WORKER_DEADLINE=$(( SECONDS + 300 ))
          while true; do
            WORKER_SUCCEEDED=$(kubectl get "job/${WORKER_JOB}" -n luks-trim -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)
            WORKER_FAILED=$(kubectl get "job/${WORKER_JOB}" -n luks-trim -o jsonpath='{.status.failed}' 2>/dev/null || echo 0)
            WORKER_ACTIVE=$(kubectl get "job/${WORKER_JOB}" -n luks-trim -o jsonpath='{.status.active}' 2>/dev/null || echo 0)

            echo "[monitor] dry-run worker ${WORKER_JOB}: active=${WORKER_ACTIVE:-0} succeeded=${WORKER_SUCCEEDED:-0} failed=${WORKER_FAILED:-0}"
            kubectl get pods -n luks-trim -l "job-name=${WORKER_JOB}" \
              -o custom-columns='NAME:.metadata.name,PHASE:.status.phase,READY:.status.containerStatuses[*].ready,RESTARTS:.status.containerStatuses[*].restartCount' \
              --no-headers 2>/dev/null || true

            if (( ${WORKER_SUCCEEDED:-0} >= 1 )) || (( ${WORKER_FAILED:-0} >= 1 )); then
              break
            fi

            if [[ $SECONDS -ge $WORKER_DEADLINE ]]; then
              echo "[FAIL] Dry-run worker job ${WORKER_JOB} did not complete within timeout"
              kubectl get "job/${WORKER_JOB}" -n luks-trim -o wide || true
              kubectl get pods -n luks-trim -l "job-name=${WORKER_JOB}" -o wide || true
              print_console_logs "dryrun-worker-timeout" "job-name=${WORKER_JOB}"
              print_namespace_events "dryrun-worker-timeout"
              exit 1
            fi

            sleep 15
          done

          echo "[diagnostic] dry-run worker job/pods:"
          kubectl get "job/${WORKER_JOB}" -n luks-trim -o wide || true
          kubectl get pods -n luks-trim -l "job-name=${WORKER_JOB}" -o wide || true
          print_console_logs "dryrun-worker" "job-name=${WORKER_JOB}"
          print_namespace_events "dryrun-worker-final"

      - name: "[T2] Assert [dry-run] lines present and no [ERROR] lines"
        run: |
          WORKER_JOB="${{ steps.dry-run-job.outputs.worker_job }}"

          print_worker_termination_details() {
            local job_name="$1"
            echo "[diagnostic] worker termination details for ${job_name}:"
            kubectl get pods -n luks-trim -l "job-name=${job_name}" \
              -o jsonpath='{range .items[*]}{.metadata.name}{" phase="}{.status.phase}{" podReason="}{.status.reason}{" termReason="}{.status.containerStatuses[0].state.terminated.reason}{" exitCode="}{.status.containerStatuses[0].state.terminated.exitCode}{"\n"}{end}' || true

            for POD in $(kubectl get pods -n luks-trim -l "job-name=${job_name}" -o name 2>/dev/null); do
              echo "[diagnostic] ${POD} container status excerpt:"
              kubectl describe -n luks-trim "${POD}" | sed -n '/^Containers:/,/^Conditions:/p' || true
            done
          }

          JOB_FAILED=$(kubectl get job "${WORKER_JOB}" -n luks-trim \
            -o jsonpath='{.status.failed}' 2>/dev/null || echo 0)
          if [[ "${JOB_FAILED}" -gt 0 ]]; then
            echo "[FAIL] Dry-run worker Job ${WORKER_JOB} has ${JOB_FAILED} failed pod(s)"
            print_worker_termination_details "${WORKER_JOB}"
            kubectl logs -n luks-trim -l "job-name=${WORKER_JOB}" --tail=-1 2>/dev/null || true
            exit 1
          fi

          LOGS=$(kubectl logs -n luks-trim \
            -l "job-name=${WORKER_JOB}" --tail=-1 2>/dev/null)

          DRYRUN_COUNT=$(echo "$LOGS" | grep -c '\[dry-run\]' || true)
          ERROR_COUNT=$(echo "$LOGS"  | grep -c '\[ERROR\]'   || true)

          echo "[dry-run] log lines : ${DRYRUN_COUNT}"
          echo "[INFO]   log lines : ${ERROR_COUNT}"

          if [[ "${DRYRUN_COUNT}" -eq 0 ]]; then
            if echo "$LOGS" | grep -q "allow_discards already active, skipping"; then
              echo "[INFO] No [dry-run] lines because allow_discards was already active."
            else
              echo "[FAIL] No [dry-run] lines found in worker logs (dryRun=true):"
              echo "$LOGS"
              exit 1
            fi
          fi

          if [[ "${ERROR_COUNT}" -gt 0 ]]; then
            echo "[FAIL] [ERROR] lines in worker logs during dry run:"
            echo "$LOGS" | grep '\[ERROR\]'
            exit 1
          fi

          echo "[PASS] Dry-run assertions passed"

      - name: "[T2] Assert actualSize unchanged during dry run"
        run: |
          VOL_NAME="${{ steps.baseline.outputs.vol_name }}"
          SIZE_AFTER=$(kubectl get volume.longhorn.io "${VOL_NAME}" \
            -n longhorn-system -o jsonpath='{.status.actualSize}')
          SIZE_BEFORE="${{ steps.dryrun-before.outputs.size }}"

          echo "Before dry run: ${SIZE_BEFORE} bytes"
          echo "After  dry run: ${SIZE_AFTER} bytes"

          # Compute |delta|; bash arithmetic doesn't handle unary minus well.
          if [[ "$SIZE_AFTER" -ge "$SIZE_BEFORE" ]]; then
            DELTA=$(( SIZE_AFTER - SIZE_BEFORE ))
          else
            DELTA=$(( SIZE_BEFORE - SIZE_AFTER ))
          fi

          # Allow up to 5 % of pre-dry-run size for normal Longhorn metadata
          # churn (snapshot bookkeeping, etc.).
          THRESHOLD=$(( SIZE_BEFORE * 5 / 100 ))
          echo "Delta: ${DELTA} bytes  (threshold: ${THRESHOLD})"

          if [[ "${DELTA}" -gt "${THRESHOLD}" ]]; then
            echo "[FAIL] actualSize changed by ${DELTA} bytes during dry run " \
                 "(threshold ${THRESHOLD}).  fstrim must NOT run in dry-run mode."
            exit 1
          fi

          echo "[PASS] actualSize stable during dry run (delta: ${DELTA} bytes)"

      # ======================================================================
      # T3 — T1-STYLE RECLAIM COVERAGE ACROSS REMAINING STORAGE CLASSES
      #
      # Keep one shared cluster, then run a reusable T1-like flow sequentially
      # for ns-key, pvc-key, and plain classes:
      #   create PVC/pod -> write -> delete -> run luks-trim -> trigger
      #   Longhorn filesystem-trim -> assert reclaim behavior.
      # ======================================================================

      - name: "[T3] Upgrade chart: dryRun=false"
        run: |
          helm upgrade luks-trim . \
            --namespace   luks-trim \
            --reuse-values \
            --set dryRun=false

      - name: "[T3] Run T1-style reclaim flow for ns/pvc/plain classes"
        run: |
          LAST_WORKER_LOGS=""
          LAST_WORKER_JOB=""

          trigger_longhorn_trim_job() {
            local case_label="$1"
            local cronjob_name="ci-filesystem-trim"
            local trigger_job="${cronjob_name}-${case_label}-$(date +%s)"

            kubectl -n longhorn-system create job "${trigger_job}" --from=cronjob/"${cronjob_name}"

            if ! kubectl -n longhorn-system wait --for=condition=complete "job/${trigger_job}" --timeout=5m; then
              echo "[FAIL] Longhorn trim job ${trigger_job} did not complete"
              kubectl -n longhorn-system get "job/${trigger_job}" -o wide || true
              kubectl -n longhorn-system get pods -l "job-name=${trigger_job}" -o wide || true
              kubectl -n longhorn-system logs -l "job-name=${trigger_job}" --tail=-1 || true
              return 1
            fi
          }

          run_luks_trim_and_assert_worker() {
            local case_label="$1"
            local coord_job="luks-trim-${case_label}-$(date +%s)"
            local prev_jobs=""
            local worker_job=""

            prev_jobs=$(kubectl get jobs -n luks-trim \
              -l "luks-trim/role=worker" -o name 2>/dev/null | sort)

            kubectl create job "${coord_job}" --from=cronjob/luks-trim -n luks-trim

            if ! kubectl wait -n luks-trim --for=condition=complete "job/${coord_job}" --timeout=5m; then
              echo "[FAIL] Coordinator ${coord_job} did not complete"
              kubectl get "job/${coord_job}" -n luks-trim -o wide || true
              kubectl logs -n luks-trim -l "job-name=${coord_job}" --tail=-1 || true
              kubectl -n luks-trim get events --sort-by=.lastTimestamp | tail -n 80 || true
              return 1
            fi

            local deadline=$(( SECONDS + 60 ))
            until [[ $SECONDS -ge $deadline ]]; do
              for new_job in $(kubectl get jobs -n luks-trim \
                -l "luks-trim/role=worker" \
                --sort-by='.metadata.creationTimestamp' \
                -o name 2>/dev/null | sed 's|job.batch/||'); do
                if ! echo "$prev_jobs" | grep -qF "job.batch/${new_job}"; then
                  worker_job="$new_job"
                fi
              done
              [[ -n "$worker_job" ]] && break
              sleep 3
            done

            if [[ -z "$worker_job" ]]; then
              echo "[FAIL] No new worker job found for case ${case_label}"
              kubectl get jobs -n luks-trim -l "luks-trim/role=worker" -o wide || true
              return 1
            fi

            if ! kubectl wait -n luks-trim --for=condition=complete "job/${worker_job}" --timeout=5m; then
              echo "[FAIL] Worker ${worker_job} did not complete"
              kubectl get "job/${worker_job}" -n luks-trim -o wide || true
              kubectl get pods -n luks-trim -l "job-name=${worker_job}" -o wide || true
              kubectl logs -n luks-trim -l "job-name=${worker_job}" --tail=-1 || true
              return 1
            fi

            local logs
            logs=$(kubectl logs -n luks-trim -l "job-name=${worker_job}" --tail=-1 2>/dev/null)
            local error_count
            error_count=$(echo "$logs" | grep -c '\[ERROR\]' || true)
            if [[ "$error_count" -gt 0 ]]; then
              echo "[FAIL] Worker ${worker_job} emitted [ERROR] lines"
              echo "$logs" | grep '\[ERROR\]' || true
              return 1
            fi

            LAST_WORKER_LOGS="$logs"
            LAST_WORKER_JOB="$worker_job"

            echo "[PASS] ${case_label}: worker ${worker_job} completed cleanly (no failure markers in worker log)"
          }

          run_case() {
            local case_label="$1"
            local storage_class="$2"
            local pvc_name="$3"
            local pod_name="$4"
            local write_mib="$5"
            local min_reclaim_mib="$6"

            echo "===== [T3:${case_label}] storageClass=${storage_class} pvc=${pvc_name} ====="

            kubectl apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: ${pvc_name}
            namespace: luks-trim-test
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: ${storage_class}
            resources:
              requests:
                storage: 512Mi
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${pod_name}
            namespace: luks-trim-test
          spec:
            containers:
              - name: filler
                image: ubuntu:24.04
                command: ["sleep", "3600"]
                volumeMounts:
                  - name: data
                    mountPath: /data
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: ${pvc_name}
            restartPolicy: Never
          EOF

            kubectl wait pod/"${pod_name}" -n luks-trim-test --for=condition=Ready --timeout=5m

            kubectl exec "${pod_name}" -n luks-trim-test -- \
              dd if=/dev/urandom of=/data/t3-file.bin bs=1M count="${write_mib}" status=none
            kubectl exec "${pod_name}" -n luks-trim-test -- sync
            sleep 10

            local vol_name
            vol_name=$(kubectl get pvc "${pvc_name}" -n luks-trim-test -o jsonpath='{.spec.volumeName}')
            local size_after_write
            size_after_write=$(kubectl get volume.longhorn.io "${vol_name}" -n longhorn-system -o jsonpath='{.status.actualSize}')
            local write_floor=$(( write_mib * 1024 * 1024 * 70 / 100 ))
            if [[ "${size_after_write}" -lt "${write_floor}" ]]; then
              echo "[FAIL] ${case_label}: actualSize ${size_after_write} below floor ${write_floor} after write"
              return 1
            fi

            kubectl exec "${pod_name}" -n luks-trim-test -- rm /data/t3-file.bin
            kubectl exec "${pod_name}" -n luks-trim-test -- sync
            sleep 10

            local pre_trim
            pre_trim=$(kubectl get volume.longhorn.io "${vol_name}" -n longhorn-system -o jsonpath='{.status.actualSize}')

            run_luks_trim_and_assert_worker "${case_label}"
            trigger_longhorn_trim_job "${case_label}"
            sleep 20

            local post_trim
            post_trim=$(kubectl get volume.longhorn.io "${vol_name}" -n longhorn-system -o jsonpath='{.status.actualSize}')
            local reclaimed=$(( pre_trim - post_trim ))
            local min_reclaim_bytes=$(( min_reclaim_mib * 1024 * 1024 ))
            local pre_trim_mib=$(( pre_trim / 1024 / 1024 ))
            local post_trim_mib=$(( post_trim / 1024 / 1024 ))
            local reclaimed_mib=$(( reclaimed / 1024 / 1024 ))

            echo "[INFO] ${case_label}: before=${pre_trim_mib}MiB (${pre_trim} bytes), after=${post_trim_mib}MiB (${post_trim} bytes), reclaimed=${reclaimed_mib}MiB (${reclaimed} bytes)"

            if [[ "${min_reclaim_mib}" -gt 0 ]]; then
              if [[ "${reclaimed}" -lt "${min_reclaim_bytes}" ]]; then
                if echo "$LAST_WORKER_LOGS" | grep -q "allow_discards already active, skipping"; then
                  echo "[WARN] ${case_label}: reclaimed ${reclaimed} bytes but worker ${LAST_WORKER_JOB} reported allow_discards already active"
                else
                  echo "[FAIL] ${case_label}: reclaimed ${reclaimed} bytes (< ${min_reclaim_bytes})"
                  return 1
                fi
              fi
            else
              if [[ "${post_trim}" -gt "${pre_trim}" ]]; then
                echo "[FAIL] ${case_label}: post-trim size grew (${post_trim} > ${pre_trim})"
                return 1
              fi
            fi

            kubectl delete pod "${pod_name}" -n luks-trim-test --ignore-not-found=true
            kubectl delete pvc "${pvc_name}" -n luks-trim-test --ignore-not-found=true
            kubectl wait --for=delete pod/"${pod_name}" -n luks-trim-test --timeout=3m || true
            kubectl wait --for=delete pvc/"${pvc_name}" -n luks-trim-test --timeout=3m || true

            echo "[PASS] ${case_label}: T1-style reclaim flow passed"
          }

          run_case "ns" "luks-ns-key" "t3-ns-vol" "t3-ns-filler" 256 128
          run_case "pvc" "luks-pvc-key" "t3-pvc-vol" "t3-pvc-filler" 256 128
          run_case "plain" "no-encryption" "t3-plain-vol" "t3-plain-filler" 256 0

      # ======================================================================
      # ALWAYS: diagnostics on failure, then cluster teardown
      # ======================================================================

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== Nodes ==="
          kubectl get nodes -o wide || true

          echo "=== Pods (all namespaces) ==="
          kubectl get pods -A || true

          echo "=== Longhorn volumes ==="
          kubectl get volume.longhorn.io -n longhorn-system -o wide || true

          echo "=== luks-trim jobs ==="
          kubectl get jobs -n luks-trim -o wide || true

          echo "=== Coordinator logs ==="
          kubectl logs -n luks-trim \
            -l "luks-trim/role=coordinator" --tail=100 || true

          echo "=== Worker logs ==="
          kubectl logs -n luks-trim \
            -l "luks-trim/role=worker" --tail=200 || true

          echo "=== Worker pod termination details ==="
          kubectl get pods -n luks-trim -l "luks-trim/role=worker" \
            -o jsonpath='{range .items[*]}{.metadata.name}{" phase="}{.status.phase}{" podReason="}{.status.reason}{" termReason="}{.status.containerStatuses[0].state.terminated.reason}{" exitCode="}{.status.containerStatuses[0].state.terminated.exitCode}{"\n"}{end}' || true

          for POD in $(kubectl get pods -n luks-trim -l "luks-trim/role=worker" -o name 2>/dev/null); do
            echo "=== ${POD} container status excerpt ==="
            kubectl describe -n luks-trim "${POD}" | sed -n '/^Containers:/,/^Conditions:/p' || true
          done

          echo "=== Longhorn manager logs (last 50 lines) ==="
          kubectl logs -n longhorn-system \
            -l "app=longhorn-manager" --tail=50 || true

          echo "=== filler pod events ==="
          kubectl describe pod filler -n luks-trim-test || true

      - name: Destroy Talos QEMU cluster
        if: always()
        run: |
          talosctl cluster destroy \
            --name "$CLUSTER_NAME" --provisioner qemu || true
