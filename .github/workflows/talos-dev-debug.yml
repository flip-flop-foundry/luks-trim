name: Talos Dev Provisioner Debug

on:
  push:
    branches:
      - research/qemu-image-cache
  workflow_dispatch:
    inputs:
      talos-version:
        description: >
          Talos version without the leading "v" (for example 1.13.2).
          Leave blank to use the latest stable release.
        required: false
        default: ''
        type: string

concurrency:
  group: talos-dev-debug
  cancel-in-progress: false

env:
  CLUSTER_NAME: luks-trim-dev-debug
  RESTORE_CLUSTER_NAME: luks-trim-dev-debug-restore
  TALOSCONFIG: ${{ github.workspace }}/talosconfig
  KUBECONFIG: ${{ github.workspace }}/kubeconfig

jobs:
  talos-dev-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      talos-version: ${{ steps.talos.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y qemu-system-x86 qemu-kvm cpu-checker dnsmasq
          sudo chmod 666 /dev/kvm
          kvm-ok

      - name: Resolve Talos version
        id: talos
        run: |
          VER="${{ inputs.talos-version }}"
          if [[ -z "$VER" ]]; then
            VER=$(curl -sSfL https://api.github.com/repos/siderolabs/talos/releases/latest \
              | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Talos version: v${VER}"

      - name: Install talosctl
        run: |
          curl -sSfL \
            "https://github.com/siderolabs/talos/releases/download/v${{ steps.talos.outputs.version }}/talosctl-linux-amd64" \
            -o /usr/local/bin/talosctl
          chmod +x /usr/local/bin/talosctl
          talosctl version --client

      - name: Download Talos kernel and initramfs for dev provisioner
        env:
          TALOS_VERSION: ${{ steps.talos.outputs.version }}
        run: |
          mkdir -p _out
          curl -sSfL \
            "https://github.com/siderolabs/talos/releases/download/v${TALOS_VERSION}/vmlinuz-amd64" \
            -o _out/vmlinuz-amd64
          curl -sSfL \
            "https://github.com/siderolabs/talos/releases/download/v${TALOS_VERSION}/initramfs-amd64.xz" \
            -o _out/initramfs-amd64.xz
          ls -lh _out

      - name: Create Talos dev cluster
        env:
          TALOS_VERSION: ${{ steps.talos.outputs.version }}
        run: |
          cat > /tmp/mc-patch.yaml <<EOF
          cluster:
            allowSchedulingOnControlPlanes: true
          machine:
            install:
              image: factory.talos.dev/installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245:v${TALOS_VERSION}
          EOF

          AVAILABLE_MIB=$(df -Pm "$HOME" | awk 'NR==2 {print $4}')
          RESERVED_MIB=12288
          MIN_DISK_MIB=10240
          MAX_DISK_MIB=12288
          TALOS_DISK_MIB=$(( AVAILABLE_MIB - RESERVED_MIB ))

          if (( TALOS_DISK_MIB > MAX_DISK_MIB )); then
            TALOS_DISK_MIB=$MAX_DISK_MIB
          fi

          if (( TALOS_DISK_MIB < MIN_DISK_MIB )); then
            echo "[FAIL] Not enough free disk for Talos VM"
            echo "[diagnostic] available=${AVAILABLE_MIB}MiB reserved=${RESERVED_MIB}MiB required_min=${MIN_DISK_MIB}MiB"
            df -h "$HOME" || true
            exit 1
          fi

          echo "[info] host free space under $HOME: ${AVAILABLE_MIB}MiB"
          echo "[info] selected Talos disk size: ${TALOS_DISK_MIB}MiB"

          MONITOR_START=$(date +%s)
          ROUTE_DIAG_DUMPED=0

          dump_network_diagnostics() {
            local target_node="${1:-}"

            echo "[diagnostic] network interfaces (brief):"
            ip -br addr || true
            echo "[diagnostic] network links (brief):"
            ip -br link || true
            echo "[diagnostic] route table:"
            ip route show || true
            echo "[diagnostic] bridge links:"
            bridge link show || true

            if [[ -n "${target_node}" ]]; then
              echo "[diagnostic] route lookup for ${target_node}:"
              ip route get "${target_node}" || true
            fi

            local cp_pid_file="${HOME}/.talos/clusters/${CLUSTER_NAME}/${CLUSTER_NAME}-controlplane-1.pid"
            if [[ -f "${cp_pid_file}" ]]; then
              local cp_pid
              cp_pid=$(cat "${cp_pid_file}" 2>/dev/null || true)
              echo "[diagnostic] controlplane pid file: ${cp_pid_file} -> ${cp_pid:-unknown}"
              if [[ -n "${cp_pid}" ]]; then
                ps -p "${cp_pid}" -o pid,ppid,stat,etime,command || true
              fi
            fi
          }

          monitor_talos_create() {
            while true; do
              NOW=$(date +%s)
              ELAPSED=$(( NOW - MONITOR_START ))
              echo "[monitor] $(date -u +%Y-%m-%dT%H:%M:%SZ) talos-create elapsed=${ELAPSED}s"

              QEMU_COUNT=$(pgrep -fc 'qemu-system|qemu-kvm' || true)
              echo "[monitor] qemu process count (system|kvm): ${QEMU_COUNT}"

              FREE_MIB=$(df -Pm "$HOME" | awk 'NR==2 {print $4}')
              echo "[monitor] host free space under $HOME: ${FREE_MIB:-unknown}MiB"

              if [[ -f "$TALOSCONFIG" ]]; then
                echo "[monitor] talosconfig detected: ${TALOSCONFIG}"

                if timeout --signal=TERM 10s sudo -E talosctl --talosconfig "$TALOSCONFIG" config info -o yaml >/tmp/talos-config-info.log 2>&1; then
                  TALOS_NODE=$(awk '
                    /^nodes:/ {in_nodes=1; in_endpoints=0; next}
                    /^endpoints:/ {in_endpoints=1; in_nodes=0; next}
                    /^[^[:space:]-]/ {in_nodes=0; in_endpoints=0}
                    in_nodes && $1 == "-" {print $2; exit}
                  ' /tmp/talos-config-info.log)

                  if [[ -z "${TALOS_NODE}" ]]; then
                    TALOS_NODE=$(awk '
                      /^endpoints:/ {in_endpoints=1; next}
                      /^[^[:space:]-]/ {in_endpoints=0}
                      in_endpoints && $1 == "-" {print $2; exit}
                    ' /tmp/talos-config-info.log | sed -E 's#^https?://##; s#:[0-9]+$##')
                  fi

                  if [[ -n "${TALOS_NODE}" ]]; then
                    echo "[monitor] talos node target: ${TALOS_NODE}"

                    if timeout --signal=TERM 10s sudo -E talosctl --talosconfig "$TALOSCONFIG" --nodes "${TALOS_NODE}" get members >/tmp/talos-members-probe.log 2>&1; then
                      echo "[monitor] talosctl get members: ok"
                      sed -n '1,20p' /tmp/talos-members-probe.log || true
                    else
                      echo "[monitor] talosctl get members rc=$?"
                      sed -n '1,8p' /tmp/talos-members-probe.log || true

                      if [[ "${ROUTE_DIAG_DUMPED}" -eq 0 ]] && grep -q "no route to host" /tmp/talos-members-probe.log; then
                        echo "[monitor] first no-route-to-host observed during get members"
                        dump_network_diagnostics "${TALOS_NODE}"
                        ROUTE_DIAG_DUMPED=1
                      fi
                    fi
                  fi
                fi
              else
                echo "[monitor] talosconfig not created yet"
              fi

              sleep 20
            done
          }

          cleanup_monitor() {
            if [[ -n "${MONITOR_PID:-}" ]]; then
              kill "${MONITOR_PID}" >/dev/null 2>&1 || true
              wait "${MONITOR_PID}" >/dev/null 2>&1 || true
            fi
          }

          monitor_talos_create &
          MONITOR_PID=$!
          trap cleanup_monitor EXIT

          set +e
          timeout --signal=TERM 45m sudo --preserve-env=HOME talosctl cluster create dev \
            --name "$CLUSTER_NAME" \
            --arch amd64 \
            --controlplanes 1 \
            --workers 0 \
            --disk "${TALOS_DISK_MIB}" \
            --disk-preallocate=false \
            --memory "4096MiB" \
            --cpus "2.0" \
            --talos-version "v${TALOS_VERSION}" \
            --config-patch-control-plane @/tmp/mc-patch.yaml \
            --talosconfig "$TALOSCONFIG" \
            --wait-timeout 30m
          CREATE_RC=$?
          set -e

          cleanup_monitor
          trap - EXIT

          if [[ "${CREATE_RC}" -ne 0 ]]; then
            echo "[FAIL] talosctl cluster create dev failed with exit code ${CREATE_RC}"
            echo "[diagnostic] qemu processes:"
            ps -ef | grep -E "qemu-system|qemu-kvm|dnsmasq|tap|bridge" | grep -v grep || true
            echo "[diagnostic] runner talos state tree (if present):"
            ls -R "${HOME}/.talos" || true
            echo "[diagnostic] /root/.talos tree (if present):"
            sudo ls -R /root/.talos || true
            echo "[diagnostic] controlplane log tail (if present):"
            tail -n 300 "${HOME}/.talos/clusters/${CLUSTER_NAME}/${CLUSTER_NAME}-controlplane-1.log" || true
            echo "[diagnostic] dhcpd/lb log tails (if present):"
            tail -n 120 "${HOME}/.talos/clusters/${CLUSTER_NAME}/dhcpd.log" || true
            tail -n 120 "${HOME}/.talos/clusters/${CLUSTER_NAME}/lb.log" || true
            exit "${CREATE_RC}"
          fi

          sudo chown "$(id -u):$(id -g)" "$TALOSCONFIG"
          talosctl version --client

      - name: Stage restore snapshot artifact
        if: success()
        env:
          TALOS_VERSION: ${{ steps.talos.outputs.version }}
        run: |
          SNAP_DIR=/tmp/talos-dev-snapshot
          rm -rf "$SNAP_DIR"
          mkdir -p "$SNAP_DIR"

          DISK_PATH="${HOME}/.talos/clusters/${CLUSTER_NAME}/${CLUSTER_NAME}-controlplane-1-0.disk"
          FLASH0_PATH="${HOME}/.talos/clusters/${CLUSTER_NAME}/${CLUSTER_NAME}-controlplane-1-flash0.img"
          FLASH1_PATH="${HOME}/.talos/clusters/${CLUSTER_NAME}/${CLUSTER_NAME}-controlplane-1-flash1.img"

          if [[ ! -f "$DISK_PATH" ]]; then
            echo "[FAIL] Snapshot disk not found at ${DISK_PATH}"
            exit 1
          fi

          if [[ ! -f "$FLASH0_PATH" || ! -f "$FLASH1_PATH" ]]; then
            echo "[FAIL] Snapshot flash images missing (${FLASH0_PATH}, ${FLASH1_PATH})"
            exit 1
          fi

          if [[ ! -f "$TALOSCONFIG" ]]; then
            echo "[FAIL] Expected talosconfig not found at ${TALOSCONFIG}"
            exit 1
          fi

          cp "$TALOSCONFIG" "$SNAP_DIR/talosconfig"

          TALOS_NODE=$(talosctl --talosconfig "$SNAP_DIR/talosconfig" config info -o yaml | awk '
            /^nodes:/ {in_nodes=1; in_endpoints=0; next}
            /^endpoints:/ {in_endpoints=1; in_nodes=0; next}
            /^[^[:space:]-]/ {in_nodes=0; in_endpoints=0}
            in_nodes && $1 == "-" {print $2; exit}
          ')

          if [[ -z "$TALOS_NODE" ]]; then
            TALOS_NODE=$(talosctl --talosconfig "$SNAP_DIR/talosconfig" config info -o yaml | awk '
              /^endpoints:/ {in_endpoints=1; next}
              /^[^[:space:]-]/ {in_endpoints=0}
              in_endpoints && $1 == "-" {print $2; exit}
            ' | sed -E 's#^https?://##; s#:[0-9]+$##')
          fi

          if [[ -n "$TALOS_NODE" ]]; then
            talosctl --talosconfig "$SNAP_DIR/talosconfig" --nodes "$TALOS_NODE" shutdown --force --wait --timeout=10m

            for _ in $(seq 1 90); do
              if ! pgrep -f "${CLUSTER_NAME}-controlplane-1-0.disk" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            if pgrep -f "${CLUSTER_NAME}-controlplane-1-0.disk" >/dev/null 2>&1; then
              echo "[warn] Control plane VM still running after shutdown request, forcing stop"
              sudo pkill -f "${CLUSTER_NAME}-controlplane-1-0.disk" || true
              sleep 5
            fi
          fi

          # Keep raw sparse disk format: no convert step needed during restore.
          cp --sparse=always "$DISK_PATH" "$SNAP_DIR/controlplane-1.disk"
          cp --sparse=always "$FLASH0_PATH" "$SNAP_DIR/flash0.img"
          cp --sparse=always "$FLASH1_PATH" "$SNAP_DIR/flash1.img"

          if [[ -n "$TALOS_NODE" ]]; then
            talosctl --talosconfig "$SNAP_DIR/talosconfig" kubeconfig --nodes "$TALOS_NODE" --merge=false "$SNAP_DIR/kubeconfig" || true
          fi

          printf 'talos_version=%s\n' "$TALOS_VERSION" > "$SNAP_DIR/metadata.env"
          printf 'talos_node=%s\n' "$TALOS_NODE" >> "$SNAP_DIR/metadata.env"
          ls -lh "$SNAP_DIR"

      - name: Upload restore snapshot artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: talos-dev-snapshot-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: /tmp/talos-dev-snapshot

      - name: Stage compact diagnostics artifact
        if: always()
        run: |
          ARTIFACT_DIR=/tmp/talos-dev-debug-artifact
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          if sudo test -f "$TALOSCONFIG"; then
            sudo cp "$TALOSCONFIG" "$ARTIFACT_DIR/talosconfig" || true
          fi

          CLUSTER_DIR="${HOME}/.talos/clusters/${CLUSTER_NAME}"
          if sudo test -d "$CLUSTER_DIR"; then
            sudo mkdir -p "$ARTIFACT_DIR/cluster"
            sudo cp -a "$CLUSTER_DIR/." "$ARTIFACT_DIR/cluster/" || true
          fi

          if sudo test -d /root/.talos; then
            sudo cp -a /root/.talos "$ARTIFACT_DIR/root-talos" || true
          fi

          # Keep diagnostics artifact small: raw disk is uploaded separately.
          find "$ARTIFACT_DIR" -type f -name '*.disk' -delete || true

          sudo chown -R "$(id -u):$(id -g)" "$ARTIFACT_DIR"

      - name: Upload Talos diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talos-dev-debug-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: /tmp/talos-dev-debug-artifact

      - name: Destroy Talos cluster
        if: always()
        run: |
          sudo --preserve-env=HOME talosctl cluster destroy --name "$CLUSTER_NAME" || true

  restore-from-snapshot:
    needs: talos-dev-debug
    if: needs.talos-dev-debug.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y qemu-system-x86 qemu-kvm cpu-checker dnsmasq
          sudo chmod 666 /dev/kvm
          kvm-ok

      - name: Install talosctl
        env:
          TALOS_VERSION: ${{ needs.talos-dev-debug.outputs.talos-version }}
        run: |
          curl -sSfL \
            "https://github.com/siderolabs/talos/releases/download/v${TALOS_VERSION}/talosctl-linux-amd64" \
            -o /usr/local/bin/talosctl
          chmod +x /usr/local/bin/talosctl
          talosctl version --client

      - name: Install kubectl
        run: |
          STABLE=$(curl -sSfL https://dl.k8s.io/release/stable.txt)
          curl -sSfL "https://dl.k8s.io/release/${STABLE}/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
          kubectl version --client

      - name: Download Talos kernel and initramfs for dev provisioner
        env:
          TALOS_VERSION: ${{ needs.talos-dev-debug.outputs.talos-version }}
        run: |
          mkdir -p _out
          curl -sSfL \
            "https://github.com/siderolabs/talos/releases/download/v${TALOS_VERSION}/vmlinuz-amd64" \
            -o _out/vmlinuz-amd64
          curl -sSfL \
            "https://github.com/siderolabs/talos/releases/download/v${TALOS_VERSION}/initramfs-amd64.xz" \
            -o _out/initramfs-amd64.xz

      - name: Download restore snapshot artifact
        uses: actions/download-artifact@v4
        with:
          name: talos-dev-snapshot-${{ github.run_id }}
          path: /tmp/talos-dev-snapshot

      - name: Boot snapshot VM and verify node is reachable
        env:
          TALOS_VERSION: ${{ needs.talos-dev-debug.outputs.talos-version }}
          RESTORED_TALOSCONFIG: /tmp/talos-dev-snapshot/talosconfig
          KUBECONFIG: ${{ github.workspace }}/restore-kubeconfig
        run: |
          SNAPSHOT_DISK=/tmp/talos-dev-snapshot/controlplane-1.disk
          FLASH0=/tmp/talos-dev-snapshot/flash0.img
          FLASH1=/tmp/talos-dev-snapshot/flash1.img
          BRIDGE_NAME=talosrestore0
          TAP_NAME=taprestore0

          if [[ ! -f "$SNAPSHOT_DISK" ]]; then
            echo "[FAIL] Snapshot disk missing at ${SNAPSHOT_DISK}"
            ls -R /tmp/talos-dev-snapshot || true
            exit 1
          fi

          if [[ ! -f "$FLASH0" || ! -f "$FLASH1" ]]; then
            echo "[FAIL] Snapshot flash images missing"
            ls -R /tmp/talos-dev-snapshot || true
            exit 1
          fi

          if [[ ! -f "$RESTORED_TALOSCONFIG" ]]; then
            echo "[FAIL] Restored talosconfig missing at ${RESTORED_TALOSCONFIG}"
            ls -R /tmp/talos-dev-snapshot || true
            exit 1
          fi

          # Remove stale interfaces from previous attempts if they exist.
          sudo ip link set "$TAP_NAME" down >/dev/null 2>&1 || true
          sudo ip tuntap del dev "$TAP_NAME" mode tap >/dev/null 2>&1 || true
          sudo ip link set "$BRIDGE_NAME" down >/dev/null 2>&1 || true
          sudo ip link del "$BRIDGE_NAME" type bridge >/dev/null 2>&1 || true

          sudo ip link add "$BRIDGE_NAME" type bridge
          sudo ip addr add 10.5.0.1/24 dev "$BRIDGE_NAME"
          sudo ip link set "$BRIDGE_NAME" up

          sudo ip tuntap add dev "$TAP_NAME" mode tap
          sudo ip link set "$TAP_NAME" master "$BRIDGE_NAME"
          sudo ip link set "$TAP_NAME" up

          # DHCP server leases 10.5.0.2, matching the Talos lab network used by
          # the original cluster build.
          sudo dnsmasq \
            --interface="$BRIDGE_NAME" \
            --bind-interfaces \
            --except-interface=lo \
            --dhcp-range=10.5.0.2,10.5.0.2,255.255.255.0,1h \
            --dhcp-option=3,10.5.0.1 \
            --dhcp-option=6,10.5.0.1 \
            --port=0 \
            --pid-file=/tmp/dnsmasq-restore.pid \
            --log-facility=/tmp/dnsmasq-restore.log

          sudo nohup qemu-system-x86_64 \
            -m 4096 \
            -smp cpus=2 \
            -cpu max \
            -nographic \
            -netdev tap,id=net0,ifname="$TAP_NAME",script=no,downscript=no \
            -device virtio-net-pci,netdev=net0,mac=26:13:11:1c:7b:76,host_mtu=1500 \
            -device virtio-rng-pci \
            -device virtio-balloon,deflate-on-oom=on \
            -no-reboot \
            -boot order=c,reboot-timeout=5000 \
            -drive id=virtio0,format=raw,if=none,file="$SNAPSHOT_DISK",cache=none \
            -device virtio-blk-pci,drive=virtio0,logical_block_size=512,physical_block_size=512 \
            -machine q35,accel=kvm,smm=on \
            -drive file="$FLASH0",format=raw,if=pflash \
            -drive file="$FLASH1",format=raw,if=pflash \
            >/tmp/restore-qemu.log 2>&1 &

          sleep 5
          if ! pgrep -f "qemu-system-x86_64.*controlplane-1.disk" >/dev/null 2>&1; then
            echo "[FAIL] QEMU restore VM did not stay running"
            tail -n 200 /tmp/restore-qemu.log || true
            exit 1
          fi

          sudo chown "$(id -u):$(id -g)" "$RESTORED_TALOSCONFIG" || true

          ACTIVE_TALOSCONFIG=/tmp/restore-active-talosconfig
          cp "$RESTORED_TALOSCONFIG" "$ACTIVE_TALOSCONFIG"

          # Use the node directly; no load balancer process is involved in this
          # direct restore boot path.
          talosctl --talosconfig "$ACTIVE_TALOSCONFIG" config endpoint 10.5.0.2
          talosctl --talosconfig "$ACTIVE_TALOSCONFIG" config node 10.5.0.2

          TALOS_NODE=$(talosctl --talosconfig "$ACTIVE_TALOSCONFIG" config info -o yaml | awk '
            /^nodes:/ {in_nodes=1; in_endpoints=0; next}
            /^endpoints:/ {in_endpoints=1; in_nodes=0; next}
            /^[^[:space:]-]/ {in_nodes=0; in_endpoints=0}
            in_nodes && $1 == "-" {print $2; exit}
          ')

          if [[ -z "$TALOS_NODE" ]]; then
            TALOS_NODE=$(talosctl --talosconfig "$ACTIVE_TALOSCONFIG" config info -o yaml | awk '
              /^endpoints:/ {in_endpoints=1; next}
              /^[^[:space:]-]/ {in_endpoints=0}
              in_endpoints && $1 == "-" {print $2; exit}
            ' | sed -E 's#^https?://##; s#:[0-9]+$##')
          fi

          if [[ -z "$TALOS_NODE" ]]; then
            echo "[FAIL] Could not determine Talos node from restored talosconfig"
            exit 1
          fi

          for _ in $(seq 1 60); do
            if talosctl --talosconfig "$ACTIVE_TALOSCONFIG" --nodes "$TALOS_NODE" get members >/tmp/restore-members.log 2>&1; then
              break
            fi
            sleep 5
          done

          if ! talosctl --talosconfig "$ACTIVE_TALOSCONFIG" --nodes "$TALOS_NODE" get members >/tmp/restore-members.log 2>&1; then
            echo "[FAIL] Restored Talos API was not reachable"
            sed -n '1,40p' /tmp/restore-members.log || true
            tail -n 200 /tmp/restore-qemu.log || true
            exit 1
          fi

          talosctl --talosconfig "$ACTIVE_TALOSCONFIG" kubeconfig --nodes "$TALOS_NODE" --merge=false /tmp/kubeconfig
          sudo cp /tmp/kubeconfig "$KUBECONFIG"
          sudo chown "$(id -u):$(id -g)" "$KUBECONFIG"

          CURRENT_CONTEXT=$(kubectl --kubeconfig "$KUBECONFIG" config current-context)
          CURRENT_CLUSTER=$(kubectl --kubeconfig "$KUBECONFIG" config view -o jsonpath="{.contexts[?(@.name=='${CURRENT_CONTEXT}')].context.cluster}")
          kubectl --kubeconfig "$KUBECONFIG" config set-cluster "$CURRENT_CLUSTER" --server=https://10.5.0.2:6443

          for _ in $(seq 1 30); do
            if kubectl --kubeconfig "$KUBECONFIG" wait node --all --for=condition=Ready --timeout=20s >/tmp/restore-kubectl-wait.log 2>&1; then
              break
            fi
            sleep 10
          done

          if ! kubectl --kubeconfig "$KUBECONFIG" wait node --all --for=condition=Ready --timeout=20s >/tmp/restore-kubectl-wait.log 2>&1; then
            echo "[FAIL] Restored Kubernetes API was not reachable/ready"
            sed -n '1,60p' /tmp/restore-kubectl-wait.log || true
            tail -n 200 /tmp/restore-qemu.log || true
            exit 1
          fi

          kubectl --kubeconfig "$KUBECONFIG" get nodes -o wide

      - name: Cleanup restored VM and network
        if: always()
        run: |
          sudo pkill -f "qemu-system-x86_64.*controlplane-1.disk" || true
          if [[ -f /tmp/dnsmasq-restore.pid ]]; then
            sudo kill "$(cat /tmp/dnsmasq-restore.pid)" || true
          fi
          sudo ip link set taprestore0 down >/dev/null 2>&1 || true
          sudo ip tuntap del dev taprestore0 mode tap >/dev/null 2>&1 || true
          sudo ip link set talosrestore0 down >/dev/null 2>&1 || true
          sudo ip link del talosrestore0 type bridge >/dev/null 2>&1 || true